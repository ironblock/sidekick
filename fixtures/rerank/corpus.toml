# Rerank parity corpus: the (query, documents) groups every reranker is
# graded on (docs/design/rerank.md). 51 pairs in 13 groups.
#
# A reranker's reference scores each pair with sentence-transformers'
# CrossEncoder in fp32. The parity suite runs the same pairs through
# sidekick's product path (pair tokenization, truncation, bucketing,
# padding, prediction, activation). It grades |Δ relevance_score| per pair,
# and rank flips within each group where the reference's score gap is at
# least the flip margin. References record this file's hash as D26 does
# (comment lines and blank lines excluded).
#
# Fields:
#   id         group id
#   query      the query
#   documents  the documents, in request order
#   repeat     optional: each document is this many copies of its text,
#              joined by a space (for inputs longer than the model)
#   relevant   optional: indices of documents a person would rank on top.
#              Reported, never graded.
#   tags       failure modes the group targets:
#     ranking     ordinary relevance ranking over mixed documents
#     near-tie    documents that differ by a word: flips there are near-ties
#     empty       an empty document
#     truncated   a pair longer than the largest bucket; the suite sends
#                 truncate_prompt_tokens (the model's maximum)
#     delimiters  literal special-token strings in the query or a document
#     multilingual, code, numbers
#                 vocabulary a reranker trained on English prose sees rarely

[[group]]
id = "pets"
query = "Where did the cat sit?"
documents = [
  "A cat sat on the mat.",
  "A kitten was resting on the rug.",
  "Quarterly earnings exceeded analyst expectations, lifting the stock.",
  "Dogs are often trained to sit on command.",
  "The mat by the door is new.",
]
relevant = [0, 1]
tags = ["ranking"]

