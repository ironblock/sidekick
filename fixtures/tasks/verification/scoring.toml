# External baselines, in their own code at their defaults (design §7.5 B).
# Heavy CPU or MPS jobs: run by the maintainer, one at a time, never in CI.
[minicheck]
id = "minicheck-deberta-v3-large"
model = "lytang/minicheck-deberta-v3-large"   # the repository id, lowercased; its own loader names it
revision = "2f2d01a54fa022a7ffadb76260e1ea8bc88c82bb"
code = "Liyan06/MiniCheck"
code_revision = "b58b9fa69acbd1015ec970fa65dd752413a053d2"
chunk_size = 400        # MiniCheck's default for deberta-v3-large
max_model_len = 2048    # its default
threshold = 0.5         # its own: supported if p > 0.5
sha256_tokenizer = "8bfb874b90f3b3ea9481289bf351eef77462f0935f526ea107f53789708cc5d4"
reader = "chunk-400"

[hhem]
id = "HHEM-2.1-Open"
model = "vectara/hallucination_evaluation_model"
revision = "de9a5e6ba9ba49531a022dba17e35ffeb2a6fad8"
sha256_foundation_tokenizer = "fe2ebbbbde2985be723e0ce18217853e4020c5e9d35bd07be2c27ab9d3ead57a"
threshold = 0.5         # consistent if p ≥ 0.5, as its model card reads scores
reader = "full"         # it takes the whole premise: no chunks
# Its attention is quadratic in the premise, so a 32k haystack can't run in
# 32 GB; longer premises (flan-t5 tokens) are reported as not run, and its
# ceiling counts only the triples that ran. Deviation 2 below.
max_premise_tokens = 8192

[foundation_models]
id = "foundation-models"
route = "/v1/chat/completions"
temperature = 0
max_tokens = 64
reader = "full"

# J and the second reader: an LLM over an OpenAI-compatible endpoint, run
# outside this repository from an exported JSONL batch (design §6.5). The
# endpoint, its key and its model never appear here; the model's public id
# is taken from the response file.
# Deviations from the pre-registered design, confirmed by the reviewer
# (design §7). The report lists each in its header and its MODELS.md section;
# `beside` names numbers the text must stand beside.
[[deviation]]
id = "not-run-controls"
text = "Controls a checker can't run (Foundation Models' long forms, over its context) are left out of its gate and reported as not run."

[[deviation]]
id = "hhem-premise-cap"
text = "HHEM's premise is capped at 8,192 tokens. It ran 29 of 54 triples, and its ceiling counts only those."

[[deviation]]
id = "chunk-400-approximate"
text = "chunk-400 shadows MiniCheck only approximately: 40% of chunks match exactly, and 181 of 198 chunk counts agree."
beside = "chunk-400"
note = "approximate MiniCheck shadow: 40% of chunks exact, 181/198 chunk counts agree"

[[deviation]]
id = "lenient-parse-quoted-json"
text = "Written down post-data, after the judge's responses were seen: the lenient parse rule reads a JSON record that an answer quotes from the evidence inside its prose as prose, so only a second verdict object fails it. Read literally (any second JSON object fails), 14 more of the 6,289 reader answers would have failed; both counts are reported per form."

# What the failed checkers' control failures are attributed to, from the
# audit after the first scored round, written down post-data. The verdicts don't change:
# every failed checker stays instrument-limited. A family without an entry,
# or whose entry isn't "attributed", reads "cause not yet attributed". The audit verified the
# construction (the checkpoints' id2label against the classes the harness
# used; premise first and hypothesis second on the wire for the nli
# format, MiniCheck and HHEM; the textbook MNLI triple right for every nli
# model, MiniCheck and HHEM, and the harness's requests identical to D47's
# stock request); its raw evidence is staged beside the report.
[audit]
second_reader = "The second reader passing its controls through the same windows and max rule rules out two things: the information missing from the windows, and the max rule losing it. It does not by itself rule out each checker's own interface, label mapping, tokenizer cuts or τ, or the domain."
construction = "The audit after the first scored round found no construction bug: each three-way checkpoint's id2label matches the classes the harness read; the evidence is the premise and the claim the hypothesis on the wire for the nli format, MiniCheck and HHEM; every nli model, MiniCheck and HHEM gets the textbook MNLI triple right through the harness's own client path, which gives exactly what D47's stock request gives; every short control is a single window."
open = "interface, label mapping, tokenizer cuts, τ, domain"

# Each entry's `status`:
# - "attributed": the report says "cause attributed by the audit: <label>: <text>";
# - "candidates": "cause not yet attributed; candidates from the audit:", then
#   `candidate`, then `support`, the numbers behind it;
# - "unattributed": `text` says so itself, and why.
[[attribution]]
families = ["A3", "A3g"]
label = "Three-way nli models"
status = "unattributed"
text = "cause not yet attributed; interface verified (construction eliminated). Leading candidate: the domain, including the corpus's claim formats (refutation notes, source-prefixed claims). Not attributed because at least one short control is not easy by construction (the rustc contradiction control, whose sibling line `cargo 1.94.1` carries the claim's exact value). No τ from 0.05 to 0.95 passes their controls, gated or not, even on single-window short forms, where the errors are confident: a near-verbatim claim read as neutral at 0.98, and a matching-kind complete artifact (`cat app.toml` against a `service.toml` claim) read as a contradiction at 0.998."

[[attribution]]
families = ["A2g"]
label = "Two-way nli models, gated"
status = "candidates"
candidate = "τ (post-hoc sweep on the gate's own controls; not held out)"
support = "At τ ≤ 0.1 both pass every control group (deberta-v3-large-zeroshot-v2.0-c at 0.05 and 0.1, bge-m3-zeroshot-v2.0-c at 0.05); their entailment on CLI evidence runs low. Not applied: τ was fixed at 0.5 in advance, and tuning waits for a dev split."

[[attribution]]
families = ["A2"]
label = "Two-way nli models, ungated"
status = "candidates"
candidate = "max-aggregation over long forms (the short forms pass at τ = 0.05, or nearly: deberta-v3-large-zeroshot-v2.0-c 12 of 12, bge-m3-zeroshot-v2.0-c 11 of 12); τ from a post-hoc sweep on the gate's own controls, not held out"
support = "No τ passes the full gate: deberta-v3-large-zeroshot-v2.0-c fails its long forms (at best 21 of 24 controls, at τ = 0.35), and bge-m3-zeroshot-v2.0-c's long nulls are 0 of 6 at the τ that passes its positives, as some window of a long form crosses a threshold that low."

[[attribution]]
families = ["M"]
label = "MiniCheck"
status = "unattributed"
text = "cause not yet attributed; interface verified (construction eliminated). Leading candidate: the domain, including the corpus's claim formats (refutation notes, source-prefixed claims). Not attributed because at least one short control is not easy by construction (the rustc contradiction control, whose sibling line `cargo 1.94.1` carries the claim's exact value). No threshold passes: the refutation-format positive (`was: … wrong because …`) scores 0.018 short and 0.089 long; its interface is verified (evidence first, the MNLI triple right)."

[[attribution]]
families = ["H"]
label = "HHEM"
status = "candidates"
candidate = "τ (post-hoc sweep on the gate's own controls; not held out)"
support = "At a threshold of 0.15 or below it passes every control it ran (its long forms are over the premise cap); its interface is verified. Not applied."

[[attribution]]
families = ["F"]
label = "Foundation Models"
status = "attributed"
text = "the model's own behaviour. On the 16 NOT MENTIONED variants that fit its context, rerun without the prompt's rules block it still answers C on 13 (exploratory); the rules block accounts for 3."

# Findings for the next corpus round, from the reviewer's reading of this
# round's results. This round's labels and scores don't change.
[[finding]]
id = "nm-empty-output-nonzero-exit"
text = "Five NOT MENTIONED variants keep the needle's call with its output emptied and its nonzero exit visible (`empty-output-nonzero-exit`: 002, 025, 026, 031, 032); the other 49 remove it. A visible nonzero exit supports a claim that the call failed, so these items are a gray zone for NOT MENTIONED. They are scored apart below."
nm_kind = "empty-output-nonzero-exit"

[[finding]]
id = "c-rests-on-notes"
text = "In 027 and 028 (a refuted belief's reason), CONTRADICTED rests on a `[notes]` entry alone, with no tool output behind it."

[[finding]]
id = "controls-two-sets"
text = "Split the controls into two sets. The gate set is easy by construction: a plain-prose positive with no source prefix; a contradiction with no sibling line carrying the claimed value; a null from an unrelated capture that isn't a complete artifact of the claim's kind. The domain set is descriptive and never gates: refutation-format claims, source-prefixed claims, and matching-kind complete artifacts. A checker that passes the gate and fails the domain set then has an attribution held out from the gate. The rustc contradiction control is a defect, to be revised: its sibling line `cargo 1.94.1` carries the claim's exact value."

[judge]
max_tokens = 2048            # output budget per request, reasoning included
reasoning_effort = "medium"
assumed_reasoning_tokens = 400
