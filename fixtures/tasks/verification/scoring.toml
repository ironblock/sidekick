# External baselines, in their own code at their defaults (design §7.5 B).
# Heavy CPU or MPS jobs: run by the maintainer, one at a time, never in CI.
[minicheck]
id = "minicheck-deberta-v3-large"
model = "lytang/minicheck-deberta-v3-large"   # the repository id, lowercased; its own loader names it
revision = "2f2d01a54fa022a7ffadb76260e1ea8bc88c82bb"
code = "Liyan06/MiniCheck"
code_revision = "b58b9fa69acbd1015ec970fa65dd752413a053d2"
chunk_size = 400        # MiniCheck's default for deberta-v3-large
max_model_len = 2048    # its default
threshold = 0.5         # its own: supported if p > 0.5
sha256_tokenizer = "8bfb874b90f3b3ea9481289bf351eef77462f0935f526ea107f53789708cc5d4"
reader = "chunk-400"

[hhem]
id = "HHEM-2.1-Open"
model = "vectara/hallucination_evaluation_model"
revision = "de9a5e6ba9ba49531a022dba17e35ffeb2a6fad8"
sha256_foundation_tokenizer = "fe2ebbbbde2985be723e0ce18217853e4020c5e9d35bd07be2c27ab9d3ead57a"
threshold = 0.5         # consistent if p ≥ 0.5, as its model card reads scores
reader = "full"         # it takes the whole premise: no chunks
# Its attention is quadratic in the premise, so a 32k haystack can't run in
# 32 GB; longer premises (flan-t5 tokens) are reported as not run, and its
# ceiling counts only the triples that ran. Deviation 2 below.
max_premise_tokens = 8192

[foundation_models]
id = "foundation-models"
route = "/v1/chat/completions"
temperature = 0
max_tokens = 64
reader = "full"

# J and the second reader: an LLM over an OpenAI-compatible endpoint, run
# outside this repository from an exported JSONL batch (design §6.5). The
# endpoint, its key and its model never appear here; the model's public id
# is taken from the response file.
# Deviations from the pre-registered design, confirmed by the reviewer
# (design §7). The report lists each in its header and its MODELS.md section;
# `beside` names numbers the text must stand beside.
[[deviation]]
id = "not-run-controls"
text = "Controls a checker can't run (Foundation Models' long forms, over its context) are left out of its gate and reported as not run."

[[deviation]]
id = "hhem-premise-cap"
text = "HHEM's premise is capped at 8,192 tokens. It ran 29 of 54 triples, and its ceiling counts only those."

[[deviation]]
id = "chunk-400-approximate"
text = "chunk-400 shadows MiniCheck only approximately: 40% of chunks match exactly, and 181 of 198 chunk counts agree."
beside = "chunk-400"
note = "approximate MiniCheck shadow: 40% of chunks exact, 181/198 chunk counts agree"

[[deviation]]
id = "lenient-parse-quoted-json"
text = "The lenient parse rule reads a JSON record that an answer quotes from the evidence inside its prose as prose: only a second verdict object fails it. Read literally (any second JSON object fails), 14 more of the 6,289 reader answers would have failed; both counts are reported per form."

[judge]
max_tokens = 2048            # output budget per request, reasoning included
reasoning_effort = "medium"
assumed_reasoning_tokens = 400
