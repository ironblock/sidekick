# Scoring settings for the verification corpus (tools/tasks/scoring_*.py),
# fixed before the first scored run. Any later change is a deviation and is
# listed in the report.

schema = "sidekick-verification-scoring/1"
set = "review-4"
tau = 0.5               # primary run; tuning τ on dev waits for about 150 claims
overlap = 128           # tokens shared by consecutive windows (the generator caps needles at 96)
margin = 8              # tokens left free in every window
seed = 133              # the bootstrap's seed
resamples = 10000       # cluster bootstrap over claim shapes
mde_factor = 2.8        # MDE = 2.8 × SE of the paired difference (α = 0.05 two-sided, power 0.8)
probs_tolerance = 1e-5  # nli_probs must sum to 1 within this

[gate]
short = 6               # of 6, in every group a checker answers
long = 5
# A control a checker can't run (over its context, as the design reports
# Foundation Models' long forms) is left out of its gate and reported as
# not run, rather than counted wrong. Deviation 1 below.
exclude_not_run = true

# sidekick's nli checkers (design §1). `ways` 3 reads `nli_probs` (D47) and
# runs A3 and A3g; `ways` 2 reads e − c and runs A2 and A2g. The tokenizer is
# the installed model's tokenizer.json, checked by sha256 at run time.
[[nli]]
id = "nli-deberta-v3-base"
ways = 3
max_seq_len = 512
revision = "6c749ce3425cd33b46d187e45b92bbf96ee12ec7"
sha256_tokenizer = "5124ef2ead1a10a717703bc436de7f353da76d6340e4587719b42b1693707964"
reader = "window-512"   # the second reader's window form that shadows it exactly

[[nli]]
id = "nli-minilm2-l6-h768"
ways = 3
max_seq_len = 512
revision = "b95119ce93d3e065de6214e38cd4a97b0f2f2c6d"
sha256_tokenizer = "7b62d797c95d1563d3467f48daad0eca3e150f2d587e7e687b557c9ef1b25473"

[[nli]]
id = "nli-minilm2-l6-h768-ane"
ways = 3
max_seq_len = 512
revision = "b95119ce93d3e065de6214e38cd4a97b0f2f2c6d"
sha256_tokenizer = "7b62d797c95d1563d3467f48daad0eca3e150f2d587e7e687b557c9ef1b25473"

[[nli]]
