# ------------------------------------------------------ gh-stack 0.2.1 on gh 2.95.0
# Offline: each repository's origin is a local bare repository, and gh needs
# no network or credentials for these commands. G3 is a four-layer stack
# checked out on its second layer; G5 is a two-layer stack whose bottom layer
# gained a conflicting commit.

[[world]]
id = "gh/G3"
host_tools = ["git"]
tool = "gh"
dir = "gs/G3"
steps = [
  { run = "git init -q --bare ../G3.git && git clone -q ../G3.git . 2>/dev/null" },
  { write = "README.md", content = "# Service\n" },
  { run = "git add -A && git commit -qm 'Start the project' && git push -q -u origin main 2>/dev/null" },
  { run = "gh stack init schema >/dev/null 2>&1" },
  { write = "schema.sql", content = "tables\n" },
  { run = "gh stack add -Am 'Add the schema' >/dev/null 2>&1" },
  { write = "models.py", content = "models\n" },
  { run = "gh stack add -Am 'Add the models' models >/dev/null 2>&1" },
  { write = "routes.py", content = "routes\n" },
  { run = "gh stack add -Am 'Add the routes' routes >/dev/null 2>&1" },
  { write = "tests.py", content = "tests\n" },
  { run = "gh stack add -Am 'Add the tests' tests >/dev/null 2>&1" },
  { run = "gh stack down 2 >/dev/null 2>&1" },
]
capture = [
  { id = "gh.version", cmd = "gh --version", kind = "stdout", exit = 0 },
  { id = "gh.stack.version", cmd = "gh stack --version", kind = "stdout" },
  { id = "gh.stack.view-short", cmd = "gh stack view --short", kind = "stdout" },
  { id = "gh.stack.view-json", cmd = "gh stack view --json", kind = "json" },
  { id = "gh.git-log", cmd = "git log --oneline --decorate --graph --all", kind = "log", exit = 0 },
  { id = "gh.stack.err.version-subcommand", cmd = "gh stack version", kind = "stdout" },
  { id = "gh.stack.err.submit-draft", cmd = "gh stack submit --draft", kind = "stderr" },
  { id = "gh.stack.err.submit", cmd = "gh stack submit", kind = "stderr" },
  { id = "gh.stack.err.switch", cmd = "gh stack switch", kind = "stderr" },
  { id = "gh.stack.sync", cmd = "gh stack sync", kind = "stderr" },
]

[[world]]
id = "gh/G5"
host_tools = ["git"]
tool = "gh"
dir = "gs/G5"
steps = [
  { run = "git init -q --bare ../G5.git && git clone -q ../G5.git . 2>/dev/null" },
  { write = "README.md", content = "# Client\n" },
  { write = "config.txt", content = "timeout = 30\nretries = 1\nverbose = false\n" },
  { run = "git add -A && git commit -qm 'Add config' && git push -q -u origin main 2>/dev/null" },
  { run = "gh stack init retry-core >/dev/null 2>&1" },
  { write = "config.txt", content = "timeout = 30\nretries = 3\nverbose = false\n" },
  { run = "git commit -qam 'Set retries to 3'" },
  { write = "config.txt", content = "timeout = 30\nretries = 5\nverbose = true\n" },
  { run = "gh stack add -Am 'Raise retries and turn on verbose' retry-cli >/dev/null 2>&1" },
  { run = "git checkout -q retry-core" },
  { write = "config.txt", content = "timeout = 30\nretries = 4\nverbose = false\n" },
  { run = "git commit -qam 'Tune retries to 4'" },
]
capture = [
  { id = "gh.g5.git-log", cmd = "git log --oneline --decorate --graph --all", kind = "log", exit = 0 },
  { id = "gh.g5.stack.rebase", cmd = "gh stack rebase", kind = "stderr" },
  { id = "gh.g5.git-status", cmd = "git status --short", kind = "stdout" },
  { id = "gh.g5.git-diff", cmd = "git diff", kind = "stdout" },
]

