# Capture recipes for the verification corpus (stage 1; tools/tasks/capture.py).
#
# Every world is built from the files written here, by the pinned tools in
# tools.lock.toml, under that file's fixed environment. A capture is one
# command's stdout, stderr and exit status. `kind` names the haystack kind:
# help, stdout, stderr, toml, json, jsonl, yaml, csv, trace, source, listing,
# log or prose. `exit`, when given, is asserted.
#
# Sibling worlds ("world edits") differ from a base world in exactly one fact,
# so a contradicted variant whose fact has dependents (a count, a sum, a
# derived view) comes from really running the tool on the edited input.
#
# `host_tools` names the unpinned host tools a world's output depends on
# (git, python3, /bin/sh); captures.lock.json lists those captures per tool.
# The host's cat, ls, mkdir and sed also run here; their output in these
# recipes is file content or one fixed error line.

schema = "sidekick-verification-recipes/1"
root = "/tmp/skv"

[scan]
# The synthetic clock: every date in a capture must fall in this range.
clock = ["2026-10-01", "2026-10-01"]

# Findings the refusal scan raises on public, fixed text. Each needs a reason.
# (jj's tutorial, `jj help -k tutorial`, is not captured: its sample output
# carries real names and addresses.)

[[scan.allow]]
capture = "jj.help.metaedit"
text = "foo@bar.com"
reason = "the placeholder author in jj's own documentation of --author"

[[scan.allow]]
capture = "jj.help.metaedit"
text = "2000-01-23"
reason = "the placeholder date in jj's own documentation of --author-timestamp"

[[scan.allow]]
capture = "jj.help.kw.revsets"
text = "2024-02-01"
reason = "an example date in jj's revset documentation"

[[scan.allow]]
capture = "jj.help.kw.config"
text = "AAAAC3NzaC1lZDI1NTE5AAAAIGj+J6N6SO+4P8dOZqfR1oiay2yxhhHnagH52avUqw5h"
reason = "an example SSH public key in jj's signing documentation, not a secret"

[[scan.allow]]
capture = "jj.help.kw.config"
text = "/home/alice/.config/jj/config.toml"
reason = "an example path in jj's configuration documentation"

[[scan.allow]]
capture = "jj.help.kw.config"
text = "YOUR_WORK_EMAIL@workplace.com"
reason = "a placeholder address in jj's configuration documentation"

[[scan.allow]]
capture = "gh.help.repo-clone"
text = "git@github.com"
reason = "the SSH remote form in gh's documentation, not a person's address"

[[scan.allow]]
capture = "gh.version"
text = "2026-06-17"
reason = "gh's release date, part of its fixed version string"

[[scan.allow]]
capture = "gh.help.gist"
text = "com/OWNER/5b0e0062eb8e9654adad7bb1d81cc75f"
reason = "a placeholder gist URL in gh's documentation, not a credential"

# ------------------------------------------------------------------ jj 0.46.0
# A small recipe book with three bookmarks and a side branch, plus a working
# copy with two edits and one new file. One JJ_RANDOMNESS_SEED per command
# makes change ids reproducible; the frame pins user, host and clock.

[[world]]
id = "jj/book"
tool = "jj"
dir = "jj/book"
seed_env = "JJ_RANDOMNESS_SEED"
steps = [
  { run = "jj git init --no-colocate" },
  { write = "README.md", content = "# Recipes\n" },
  { run = "jj commit -m 'start recipe book'" },
  { write = "pasta.txt", content = "Boil water.\nAdd pasta.\n" },
  { run = "jj commit -m 'add pasta'" },
  { write = "soup.txt", content = "Chop onions.\nSimmer.\n" },
  { run = "jj commit -m 'add soup'" },
  { run = "jj bookmark create stable -r @-" },
  { write = "salad.txt", content = "Wash leaves.\nAdd dressing.\n" },
  { run = "jj commit -m 'add salad'" },
  { write = "salad.txt", content = "Wash leaves.\nAdd lemon dressing.\n" },
  { run = "jj commit -m 'tweak dressing'" },
  { run = "jj bookmark create menu -r @-" },
  { run = "jj new 'description(substring:\"add pasta\")' -m 'add dessert'" },
  { write = "dessert.txt", content = "Whip cream.\n" },
  { run = "jj new -m 'add cake'" },
  { write = "cake.txt", content = "Bake 30 min.\n" },
  { run = "jj new -m 'add icing'" },
  { write = "icing.txt", content = "Sugar and water.\n" },
  { run = "jj bookmark create sweets -r @" },
  { run = "jj new menu" },
  { append = "soup.txt", content = "Add salt.\n" },
  { append = "README.md", content = "Updated.\n" },
  { write = "scratch.log", content = "tmp\n" },
  { run = "jj status" },
]
capture = [
  { id = "jj.version", cmd = "jj --version", kind = "stdout", exit = 0 },
  { id = "jj.log", cmd = "jj log", kind = "log", exit = 0 },
  { id = "jj.log.menu-oneline", cmd = "jj log --no-graph -r '::menu' -T 'commit_id.short() ++ \" \" ++ description.first_line() ++ \"\\n\"'", kind = "log", exit = 0 },
  { id = "jj.ls", cmd = "ls -A", kind = "listing", exit = 0 },
  { id = "jj.status", cmd = "jj status", kind = "stdout", exit = 0 },
  { id = "jj.diff.add-soup", cmd = "jj diff -r 'description(substring:\"add soup\")'", kind = "stdout", exit = 0 },
  { id = "jj.log.json", cmd = "jj log --no-graph -r 'stable..menu' -T 'json(self) ++ \"\\n\"'", kind = "jsonl", exit = 0 },
  { id = "jj.op-log", cmd = "jj op log --no-graph --limit 5", kind = "log", exit = 0 },
  { id = "jj.err.ancestors-method", cmd = "jj log -r 'menu.ancestors()'", kind = "stderr", exit = 1 },
  { id = "jj.err.id-keyword", cmd = "jj log -r '::menu' --no-graph -T 'id.short()'", kind = "stderr", exit = 1 },
  { id = "jj.ok.commit-id-keyword", cmd = "jj log -r '::menu' --no-graph -T 'commit_id.short() ++ \"\\n\"'", kind = "stdout", exit = 0 },
  { id = "jj.err.file-show-colon", cmd = "jj file show 'stable:soup.txt'", kind = "stderr", exit = 1 },
  { id = "jj.ok.file-show-r", cmd = "jj file show -r stable soup.txt", kind = "stdout", exit = 0 },
  { id = "jj.ok.file-show-wc", cmd = "jj file show soup.txt", kind = "stdout", exit = 0 },
  { id = "jj.ok.file-list-stable", cmd = "jj file list -r stable", kind = "listing", exit = 0 },
  { id = "jj.err.bookmark-move-backwards", cmd = "jj bookmark move menu --to stable", kind = "stderr", exit = 1 },
  { id = "jj.bookmark-list", cmd = "jj bookmark list", kind = "stdout", exit = 0 },
  { id = "jj.help.bookmark-move", cmd = "jj help bookmark move", kind = "help", exit = 0 },
  { id = "jj.help.file-show", cmd = "jj help file show", kind = "help", exit = 0 },
  { id = "jj.help.file-list", cmd = "jj help file list", kind = "help", exit = 0 },
  { id = "jj.help.abandon", cmd = "jj help abandon", kind = "help", exit = 0 },
  { id = "jj.help.kw.filesets", cmd = "jj help -k filesets", kind = "prose", exit = 0 },
  { id = "jj.help.kw.revsets", cmd = "jj help -k revsets", kind = "prose", exit = 0 },
  { id = "jj.help.kw.templates", cmd = "jj help -k templates", kind = "prose", exit = 0 },
  { id = "jj.help.kw.bookmarks", cmd = "jj help -k bookmarks", kind = "prose", exit = 0 },
  { id = "jj.help.kw.glossary", cmd = "jj help -k glossary", kind = "prose", exit = 0 },
  { id = "jj.help.kw.config", cmd = "jj help -k config", kind = "prose", exit = 0 },
]

