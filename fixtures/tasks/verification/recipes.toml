  { id = "old.dasel.version-subcommand", cmd = "dasel version", kind = "stdout" },
]

# ------------------------------------------------- pending: toolchain recipes
# These need a pinned toolchain outside the frame's PATH, and a quiet machine.
# They run only with `capture.py run --include-pending`; their captures, and
# the triples that need them, are pending until then.

# A two-test crate whose second assertion is wrong, run offline. cargo's
# timing and thread numbering are the only moving parts; the scrub rules
# below normalize them.
[[world]]
id = "gen/cargo"
tool = "cargo"
dir = "gen/cargo"
pending = "Rust 1.94.1 (cargo) on PATH; the capture machine must be idle"
env = { PATH = "{W}/toolchain/bin:{W}/bin:/usr/bin:/bin", CARGO_HOME = "{W}/cargo", CARGO_TARGET_DIR = "{W}/target", RUST_BACKTRACE = "0", CARGO_TERM_COLOR = "never" }
steps = [
  { write = "Cargo.toml", content = "[package]\nname = \"vc-demo\"\nversion = \"0.1.0\"\nedition = \"2021\"\n" },
  { write = "src/lib.rs", content = "pub fn clamp_pct(n: i32) -> i32 { n.clamp(0, 100) }\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test] fn clamps_high() { assert_eq!(clamp_pct(140), 100); }\n    #[test] fn clamps_low() { assert_eq!(clamp_pct(-5), 5); }\n}\n" },
]
capture = [
  { id = "gen.cargo.lib-rs", cmd = "cat src/lib.rs", kind = "source", exit = 0 },
  { id = "gen.cargo.test", cmd = "cargo test --offline", kind = "stdout", exit = 101 },
]

# npm with an empty cache and no network: install fails with ENOTCACHED.
[[world]]
id = "gen/npm"
tool = "npm"
dir = "gen/npm"
pending = "node 26.5.0 and npm 11.17.0 on PATH; the capture machine must be idle"
env = { PATH = "{W}/toolchain/bin:{W}/bin:/usr/bin:/bin", npm_config_cache = "{W}/npm-cache", npm_config_userconfig = "{W}/hm/npmrc", npm_config_update_notifier = "false", npm_config_fund = "false", npm_config_audit = "false" }
steps = [
  { write = "package.json", content = "{\"name\":\"vc-demo\",\"version\":\"1.0.0\",\"scripts\":{\"build\":\"node build.js\"},\"dependencies\":{\"left-pad\":\"1.3.0\"}}\n" },
]
capture = [
  { id = "gen.npm.versions", cmd = "node --version; npm --version", kind = "stdout", exit = 0 },
  { id = "gen.npm.install-offline", cmd = "npm install --offline", kind = "stderr", exit = 1 },
  { id = "gen.npm.run-missing", cmd = "npm run nope", kind = "stderr", exit = 1 },
  { id = "gen.npm.run-build", cmd = "npm run build", kind = "trace", exit = 1 },
]

[scrub]
# Normalization for the pending recipes' nondeterministic fields.
rule = [
  { pattern = 'finished in [0-9.]+s', replace = "finished in 0.00s" },
  { pattern = 'in [0-9.]+s$', replace = "in 0.00s" },
  { pattern = "thread '([^']+)' \\([0-9]+\\) panicked", replace = "thread '\\1' panicked" },
  { pattern = '[0-9]{4}-[0-9T_:.-]+Z-debug-0', replace = "TS-debug-0" },
]
