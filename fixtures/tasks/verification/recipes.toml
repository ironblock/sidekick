# ---------------------------------------------------------------- dasel 3.11.2
# An inventory config with a database section and three services, a CSV, and
# a defaults/override pair of YAML files.

[[world]]
id = "dasel/base"
tool = "dasel"
dir = "dasel/base"
steps = [
  { write = "app.toml", content = "title = \"Inventory\"\n\n[database]\nhost = \"db.example.test\"\nport = 5432\n\n[database.pool]\nmin = 2\nmax = 20\n\n[[services]]\nname = \"api\"\nreplicas = 3\ntags = [\"http\", \"public\"]\n\n[[services]]\nname = \"worker\"\nreplicas = 5\ntags = [\"queue\"]\n\n[[services]]\nname = \"cron\"\nreplicas = 1\ntags = []\n" },
  { write = "users.csv", content = "name,age,city\nAnn,34,Oslo\nBo,28,Rome\nCy,41,Oslo\nDi,19,Kyiv\n" },
  { write = "defaults.yaml", content = "database:\n  host: db.example.test\n  port: 5432\n  pool:\n    min: 2\n    max: 20\nfeatures:\n  beta: false\n  audit: true\n" },
  { write = "override.yaml", content = "database:\n  port: 6432\n  pool:\n    max: 40\nfeatures:\n  beta: true\n" },
]
capture = [
  { id = "dasel.cat.app-toml", cmd = "cat app.toml", kind = "toml", exit = 0 },
  { id = "dasel.cat.users-csv", cmd = "cat users.csv", kind = "csv", exit = 0 },
  { id = "dasel.cat.defaults-yaml", cmd = "cat defaults.yaml", kind = "yaml", exit = 0 },
  { id = "dasel.cat.override-yaml", cmd = "cat override.yaml", kind = "yaml", exit = 0 },
  { id = "dasel.help", cmd = "dasel --help", kind = "help", exit = 0 },
  { id = "dasel.version", cmd = "dasel version", kind = "stdout", exit = 0 },
  { id = "dasel.err.version-flag", cmd = "dasel --version", kind = "stderr", exit = 80 },
  { id = "dasel.pool-max", cmd = "dasel -i toml 'database.pool.max' < app.toml", kind = "stdout", exit = 0 },
  { id = "dasel.services-json", cmd = "dasel -i toml -o json 'services' < app.toml", kind = "json", exit = 0 },
  { id = "dasel.filter-replicas", cmd = "dasel -i toml -o yaml 'services.filter(replicas >= 3).map(name)' < app.toml", kind = "yaml", exit = 0 },
  { id = "dasel.sum-replicas", cmd = "dasel -i toml 'sum(services.map(replicas)...)' < app.toml", kind = "stdout", exit = 0 },
  { id = "dasel.users-json", cmd = "dasel -i csv -o json < users.csv", kind = "json", exit = 0 },
  { id = "dasel.merge", cmd = "dasel -i yaml -o json --var o=yaml:file:./override.yaml 'merge($this, $o)' < defaults.yaml", kind = "json", exit = 0 },
  { id = "dasel.put-pool-max", cmd = "dasel -i toml --root 'database.pool.max = 50' < app.toml", kind = "toml", exit = 0 },
  { id = "dasel.err.hash-filter", cmd = "dasel -i toml 'services.filter(#.replicas >= 3)' < app.toml", kind = "stderr", exit = 1 },
  { id = "dasel.err.method-sum", cmd = "dasel -i toml 'services.map(replicas).sum()' < app.toml", kind = "stderr", exit = 1 },
]

# World edit: the worker runs 6 replicas instead of 5.
[[world]]
id = "dasel/worker6"
tool = "dasel"
dir = "dasel/worker6"
from = "dasel/base"
steps = [
  { run = "sed -i '' 's/^replicas = 5$/replicas = 6/' app.toml" },
]
capture = [
  { id = "dasel.worker6.cat.app-toml", cmd = "cat app.toml", kind = "toml", exit = 0 },
  { id = "dasel.worker6.services-json", cmd = "dasel -i toml -o json 'services' < app.toml", kind = "json", exit = 0 },
  { id = "dasel.worker6.sum-replicas", cmd = "dasel -i toml 'sum(services.map(replicas)...)' < app.toml", kind = "stdout", exit = 0 },
]

# World edit: no services at all; the database section stays.
[[world]]
