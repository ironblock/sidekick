# ------------------------------------------------------------- generic haystacks
# Files written for this corpus and read with the shell, python3 and jq.

# A service config whose comment carries an environment fact.
[[world]]
id = "gen/service"
tool = "shell"
dir = "gen/service"
steps = [
  { write = "service.toml", content = "# service settings; ports 5173, 5180 and 5181 are already in use on this host\n[server]\nport = 5182\nstrict_port = true\nwatch = false   # no file watcher in this sandbox\n\n[[routes]]\npath = \"/health\"\ntimeout_ms = 500\n\n[[routes]]\npath = \"/api\"\ntimeout_ms = 3000\n" },
]
capture = [
  { id = "gen.service.cat", cmd = "cat service.toml", kind = "toml", exit = 0 },
]

# World edit: an earlier version of the same file, on a port that is taken.
[[world]]
id = "gen/service-5180"
tool = "shell"
dir = "gen/service-5180"
from = "gen/service"
steps = [
  { run = "sed -i '' 's/^port = 5182$/port = 5180/' service.toml" },
]
capture = [
  { id = "gen.service-5180.cat", cmd = "cat service.toml", kind = "toml", exit = 0 },
]

# A package manifest with a chained lint script and a pinned package manager.
[[world]]
id = "gen/package"
tool = "shell"
dir = "gen/package"
steps = [
  { write = "package.json", content = "{\n  \"name\": \"vc-demo\",\n  \"private\": true,\n  \"packageManager\": \"pnpm@9.15.4\",\n  \"scripts\": {\n    \"build\": \"tsc -p tsconfig.build.json\",\n    \"lint\": \"eslint . && tsc --noEmit -p a && tsc --noEmit -p b && tsc --noEmit -p c\",\n    \"test\": \"vitest run --project unit\"\n  },\n  \"engines\": { \"node\": \">=22\" }\n}\n" },
]
capture = [
  { id = "gen.package.cat", cmd = "cat package.json", kind = "json", exit = 0 },
  { id = "gen.package.script-names", cmd = "jq -r '.scripts | keys[]' package.json", kind = "stdout", exit = 0 },
]

# A Python stack trace: a lookup of a key the config lacks.
[[world]]
id = "gen/trace"
host_tools = ["python3"]
tool = "shell"
dir = "gen/trace"
steps = [
  { write = "app.py", content = "def pool_max(cfg):\n    return cfg[\"pool\"][\"max\"]\n\ndef main():\n    print(pool_max({\"pool\": {\"min\": 2}}))\n\nmain()\n" },
]
capture = [
  { id = "gen.trace.cat", cmd = "cat app.py", kind = "source", exit = 0 },
  { id = "gen.trace.run", cmd = "python3 -I app.py", kind = "trace", exit = 1 },
]

# A JSONL event log of an agent session: fourteen events, four tool calls,
# two of which exited non-zero.
[[world]]
id = "gen/events"
host_tools = ["python3"]
tool = "shell"
dir = "gen/events"
steps = [
  { write = "mklog.py", content = "import json\nkinds = ['session.start', 'ask', 'request', 'tool_call', 'response', 'tool_call', 'turn.settled']\nfor i in range(1, 15):\n    k = kinds[(i - 1) % len(kinds)]\n    print(json.dumps({'seq': i * 37, 't': i * 1250, 'kind': k, 'turn': (i - 1) // len(kinds) + 1,\n                      'exit': int(k == 'tool_call' and i % 3 == 1)}, separators=(',', ':')))\n" },
  { run = "python3 -I mklog.py > events.jsonl" },
]
capture = [
  { id = "gen.events.cat", cmd = "cat events.jsonl", kind = "jsonl", exit = 0 },
  { id = "gen.events.tool-calls", cmd = "jq -c 'select(.kind==\"tool_call\")' events.jsonl", kind = "jsonl", exit = 0 },
]

# Two workers writing one job log: each buffers and flushes on its own, so
# lines are in flush order, not time order. Each line carries its time.
[[world]]
id = "gen/jobs"
tool = "shell"
dir = "gen/jobs"
steps = [
  { write = "jobs.jsonl", content = "{\"ts\":\"2026-10-01T12:00:01Z\",\"worker\":\"w1\",\"job\":\"build-7\",\"status\":\"started\"}\n{\"ts\":\"2026-10-01T12:00:02Z\",\"worker\":\"w1\",\"job\":\"lint-3\",\"status\":\"started\"}\n{\"ts\":\"2026-10-01T12:00:09Z\",\"worker\":\"w2\",\"job\":\"build-7\",\"status\":\"passed\"}\n{\"ts\":\"2026-10-01T12:00:10Z\",\"worker\":\"w2\",\"job\":\"deploy-2\",\"status\":\"queued\"}\n{\"ts\":\"2026-10-01T12:00:04Z\",\"worker\":\"w1\",\"job\":\"build-7\",\"status\":\"failed\"}\n{\"ts\":\"2026-10-01T12:00:05Z\",\"worker\":\"w1\",\"job\":\"lint-3\",\"status\":\"passed\"}\n{\"ts\":\"2026-10-01T12:00:12Z\",\"worker\":\"w2\",\"job\":\"deploy-2\",\"status\":\"started\"}\n{\"ts\":\"2026-10-01T12:00:07Z\",\"worker\":\"w1\",\"job\":\"cache-1\",\"status\":\"evicted\"}\n{\"ts\":\"2026-10-01T12:00:14Z\",\"worker\":\"w2\",\"job\":\"cache-1\",\"status\":\"rebuilt\"}\n" },
]
capture = [
  { id = "gen.jobs.cat", cmd = "cat jobs.jsonl", kind = "jsonl", exit = 0 },
]

# What the sandbox provides and refuses.
[[world]]
id = "gen/env"
host_tools = ["sh"]
tool = "shell"
dir = "gen/env"
steps = [
  { run = "mkdir ro" },
  { chmod = "ro", mode = "555" },
]
capture = [
  { id = "gen.env.missing-tool", cmd = "nosuchtool --check", kind = "stderr", exit = 127 },
  { id = "gen.env.command-v", cmd = "command -v nosuchtool", kind = "stdout", exit = 1 },
  { id = "gen.env.command-v-jq", cmd = "command -v jq", kind = "stdout", exit = 0 },
  { id = "gen.env.mkdir-ro", cmd = "mkdir ro/scratch", kind = "stderr", exit = 1 },
  { id = "gen.env.mkdir-local", cmd = "mkdir .scratch && ls -A", kind = "listing", exit = 0 },
]

# ------------------------------------------------------- older tool versions
# What older releases really do, so a note scoped to an older version says
# what that version did (claims.toml `scoped.verified_by`). Never filler.

[[world]]
id = "old/jj-0.30"
tool = "jj"
dir = "old/jj"
env = { PATH = "{W}/old/jj-0.30.0:{W}/bin:/usr/bin:/bin" }
capture = [
  { id = "old.jj.version", cmd = "jj --version", kind = "stdout", exit = 0 },
  { id = "old.jj.help.kw.filesets", cmd = "jj help -k filesets", kind = "prose", exit = 0 },
]

[[world]]
id = "old/dasel-2"
tool = "dasel"
dir = "old/dasel"
env = { PATH = "{W}/old/dasel-2.8.1:{W}/bin:/usr/bin:/bin" }
capture = [
