# The verification corpus's assembly recipe (stage 2; tools/tasks/gen_verification.py).
#
# One top-level seed. Every random choice for a triple draws from
# sha256(seed ‖ claim id ‖ length ‖ position ‖ obstacle), so adding a claim
# never reshuffles the others. Length buckets are approximate: they are set
# with the `approx-v1` estimate (tools/tasks/canon.py), not any model's
# tokenizer, and scoring records each checker's real token counts.

schema = "sidekick-verification-corpus/1"
seed = 133
max_per_shape = 3      # instances of one claim shape
max_per_fact = 2       # claims about one underlying fact (claims.toml `fact`)
dev_share = 0.2        # share of shapes, by seeded hash, in the dev split

[filler]
# Sibling worlds exist to give a variant its edited output, and old/ worlds to
# back version-scoped notes. Their captures would disagree with the base
# worlds', so they never pad a haystack.
exclude_worlds = ["jj/abandon", "dasel/worker6", "dasel/noservices", "dasel/pool25", "dasel/merge-swap",
                  "dasel/merge-noport", "gen/service-5180", "old/jj-0.30", "old/dasel-2"]

[lengths]
1k = 1000
4k = 4000
12k = 12000
32k = 32000

[positions]            # where the needle sits, as a share of the haystack
start = 0.05
middle = 0.5
end = 0.95

# The first review batch: the worked triples, then `per_type` triples per
# claim type, spread over lengths, positions and obstacles. A config whose
# needle is too long for its length moves up to the next length.
[review]
per_type = 10
lengths = ["1k", "4k", "12k", "32k"]
positions = ["start", "middle", "end"]
worked = { length = "4k", position = "middle", obstacle = "none" }
