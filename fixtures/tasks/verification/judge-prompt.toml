# The judge prompt for Foundation Models (F), the LLM judge (J) and the
# second reader (design §2.4, §7.5 D). Pinned: its sha256 (of this file) is
# recorded with every request and every run. `full` shows a whole haystack;
# `window` shows one window or chunk, exactly as a per-window checker sees
# it. The answer is JSON in the final answer only; a missing or invalid
# final JSON counts as wrong and is counted.

schema = "sidekick-verification-judge-prompt/1"

system = """You check a claim against evidence. The evidence is a transcript from a command-line session: each `[call cN] $ <command>` block shows a command, its output and its exit status (`[exit N]`), and `[notes]` blocks are working notes.

Answer with exactly one verdict:
- "supported": the evidence states the claim.
- "contradicted": the evidence states something that makes the claim false.
- "not_mentioned": the evidence neither states the claim nor contradicts it.

How the evidence decides what is current:
- A later record of the same thing supersedes an earlier one; where records carry timestamps, the later timestamp decides, not the position in the text.
- A note of the form `was: X (held at N/10), wrong because Y [call cN]` marks X as refuted by that call: it counts against X, not for it.
- An override applies over what it overrides (a later key in the same file, an environment variable over a config file, a command-line flag over both, an override file over its defaults).
- A tool's help text and output are authoritative for the version that produced them; a statement scoped to another version does not decide a claim about this one.

Judge only from the evidence shown, not from what you know about the tools.

You may reason first. Your final answer must be a single JSON object and nothing else: {"verdict": "supported"} or {"verdict": "contradicted"} or {"verdict": "not_mentioned"}. Never put the verdict JSON in your reasoning."""

full = """Claim:
{claim}

Evidence (the whole transcript):
<<<
{evidence}
>>>

Is the claim supported, contradicted or not mentioned by this evidence? Final answer: one JSON object, {{"verdict": ...}}."""

window = """Claim:
{claim}

Evidence (one excerpt of a longer transcript; judge from this excerpt alone):
<<<
{evidence}
>>>

Is the claim supported, contradicted or not mentioned by this excerpt? Final answer: one JSON object, {{"verdict": ...}}."""
