# Claims for the verification corpus, grouped by claim shape.
#
# A claim is one fact an agent might record about its session, and its
# needle: the blocks of evidence that state it, with what each variant does
# to them. SUPPORTED shows the blocks as captured; CONTRADICTED makes the
# minimal edit that flips the claim in every copy; NOT MENTIONED removes
# every copy. tools/tasks/hazards.py checks each generated triple against
# the probes below and refuses it on any hazard.
#
# Fields (see fixtures/tasks/verification/schema.json, `claim` and `block`):
# - `block`: needle blocks in text order. `capture` names a capture; `notes`
#   is authored working notes. Per variant v (s, c, nm): `<v>_from` takes the
#   output from a sibling world's capture under the same command line,
#   `<v>_notes` replaces the notes, `<v>_drop` removes the block,
#   `<v>_empty` keeps the command and exit status with no output. `edit`
#   replaces `find` in the variants it names. `role` (winner, loser) and
#   `group` (a, b) place the two slots of a "which is current" mechanism.
# - `probes`: regular expressions over the evidence. `support` states the
#   claim, `contradict` states its edited form, `mention` is anything else
#   NOT MENTIONED must not contain, `near` is what a near-miss distractor
#   shares with the claim. Filler that matches any probe or `guard` literal
#   is never drawn.
# - `exclude`: captures never used as filler for this claim because they are
#   derived views of the needle (a count, a graph that implies the result).
#
# Claim wording is this corpus's own. Each claim shape follows a kind of
# entry a host project's agents write; instances vary the tool and fact.

schema = "sidekick-verification-claims/1"

# ============================================================ tool facts

[[shape]]
id = "tool.refusal-names-override"
type = "tool"

[[shape.claim]]
id = "jj-bookmark-move-allow-backwards"
fact = "jj-bookmark-move-backwards"
worked = true
text = "gotcha: jj bookmark move won't move a bookmark backwards or sideways unless it gets --allow-backwards."
value = "--allow-backwards"
value_c = "--force"
probes.support = ['Use --allow-backwards to allow it', '^  -B, --allow-backwards$']
probes.contradict = ['Use --force to allow it', '^  -F, --force$']
probes.mention = ['backwards or sideways', 'allow-backwards']
edit_note = "c: the refusal's Hint and the help's option line name --force (-F) instead; nm: the Error and Hint lines and the whole option entry are removed, the command and its exit status stay."
[[shape.claim.block]]
capture = "jj.err.bookmark-move-backwards"
edit = [
  { find = "Hint: Use --allow-backwards to allow it.\n", c = "Hint: Use --force to allow it.\n" },
  { find = "Error: Refusing to move bookmark backwards or sideways: menu\nHint: Use --allow-backwards to allow it.\n", nm = "" },
]
[[shape.claim.block]]
capture = "jj.help.bookmark-move"
edit = [
  { find = "  -B, --allow-backwards\n", c = "  -F, --force\n", count = 1 },
  { find = "  -B, --allow-backwards\n          Allow moving bookmarks backwards or sideways\n\n", nm = "" },
]

[[shape]]
id = "tool.refused-operation"
type = "tool"

[[shape.claim]]
id = "jj-bookmark-move-menu-refused"
fact = "jj-bookmark-move-backwards"
text = "gotcha: jj bookmark move menu --to stable is refused, because it would move menu backwards."
touch = ['backwards or sideways', 'allow-backwards']
probes.support = ['Refusing to move bookmark backwards or sideways: menu']
probes.contradict = ['''\$ jj bookmark move menu --to stable\nMoved 1 bookmarks''']
probes.mention = ['Refusing to move bookmark', 'Moved 1 bookmarks']
probes.near = ['Failed to parse revset']
distractor = [{ capture = "jj.err.ancestors-method" }]
repeat = 0
edit_note = "c: the same command moves the bookmark (jj's own output when the move is allowed, run with --allow-backwards on a copy of the repository); nm: the call is removed."
[[shape.claim.block]]
capture = "jj.err.bookmark-move-backwards"
c_from = "jj.move-back.allowed"
nm_drop = true

[[shape]]
id = "tool.syntax-rejected"
type = "tool"

[[shape.claim]]
id = "dasel-filter-hash-placeholder"
fact = "dasel-filter-hash"
text = "fact: dasel 3 rejects a `#` placeholder in a filter: the selector fails to tokenize."
touch = ['filter\(']
probes.near = ['func "sum" expects']
distractor = [{ capture = "dasel.err.method-sum" }]
repeat = 0
probes.support = ['unexpected token: # at position']
probes.contradict = ['''filter\(#\.replicas >= 3\)' < app\.toml\n- api''']
probes.mention = ['unexpected token: #', 'filter\(#']
edit_note = "c: the same command prints the filtered names (the output of the working bare-field filter); nm: the call is removed."
[[shape.claim.block]]
capture = "dasel.err.hash-filter"
c_from = "dasel.filter-replicas"
nm_drop = true

[[shape]]
id = "tool.option-of-command"
type = "tool"

[[shape.claim]]
id = "jj-file-show-revision-option"
fact = "jj-file-show-revision-option"
text = "fact: jj file show picks the revision to read with -r/--revision."
value = "--revision"
value_c = "--source"
guard = ["--source"]
probes.support = ['(?s)Usage: jj file show \[OPTIONS\].{0,120}?^  -r, --revision <REVSET>\n {10}The revision to get the file contents from']
probes.contradict = ['(?s)Usage: jj file show \[OPTIONS\].{0,120}?^  -s, --source <REVSET>']
probes.mention = ['The revision to get the file contents from']
probes.near = ['Usage: jj file list']
distractor = [{ capture = "jj.help.file-list" }]
repeat = 0
edit_note = "c: the option is listed as -s, --source; nm: the option entry is removed."
[[shape.claim.block]]
capture = "jj.help.file-show"
edit = [
  { find = "  -r, --revision <REVSET>\n", c = "  -s, --source <REVSET>\n", count = 1 },
  { find = "  -r, --revision <REVSET>\n          The revision to get the file contents from\n          \n          [default: @]\n\n", nm = "" },
]

[[shape]]
id = "tool.default-side-effect"
type = "tool"

[[shape.claim]]
id = "jj-abandon-deletes-bookmarks"
fact = "jj-abandon-bookmarks"
text = "gotcha: jj abandon deletes the bookmarks on the abandoned commit; it does not move them to the parent."
touch = ['\bmenu\b', 'retain-bookmarks', 'Do not delete bookmarks']
probes.support = ['^Deleted bookmarks: menu$']
probes.contradict = ['^menu: zsuskuln 211033a3 add salad$', 'Parent commit \(@-\)      : zsuskuln 211033a3 menu \| add salad']
probes.mention = ['bookmarks: menu', '^menu: ']
repeat = 0
edit_note = "c: the abandon leaves menu on the parent and the bookmark list shows it there (jj's own output for the same abandon run with --retain-bookmarks on a copy, under the plain command line); nm: the deletion line and the bookmark list are removed."
[[shape.claim.block]]
capture = "jj.abandon.tweak"
c_from = "jj.abandon-retain.tweak"
edit = [{ find = "Deleted bookmarks: menu\n", nm = "" }]
[[shape.claim.block]]
capture = "jj.abandon.bookmark-list"
c_from = "jj.abandon-retain.bookmark-list"
nm_drop = true

# A statement scoped to a version, beside notes about an older version that
# say otherwise. The version the haystack shows decides.
[[shape]]
id = "tool.version-scoped"
type = "tool"
mechanism = "version"

[[shape.claim]]
id = "jj-bare-fileset-path-prefix-glob"
fact = "jj-fileset-bare-path"
text = "fact: in jj 0.46, a bare path in a fileset is parsed as a prefix-glob: pattern."
version = "0.46.0"
scope_re = 'jj 0\.\d+\.\d+'
probes.support = ['parsed as a `prefix-glob:` pattern']
probes.contradict = ['parsed as a `cwd:` pattern']
probes.mention = ['By default, `"path"` is parsed']
edit_note = "c: the 0.46 documentation says a bare path is a cwd: pattern; nm: that sentence is removed. The older-version note is fixed in all three."
[[shape.claim.scoped]]
notes = ["- fact (from notes kept under jj 0.30.0): a bare `\"path\"` in a fileset means the same as `cwd:\"path\"`, a cwd-relative path prefix"]
verified_by = [
  { capture = "old.jj.version", pattern = '^jj 0\.30\.0-' },
  { capture = "old.jj.help.kw.filesets", pattern = '`"path"` or `cwd:"path"`: Matches cwd-relative path prefix' },
]
[[shape.claim.block]]
capture = "jj.version"
[[shape.claim.block]]
capture = "jj.help.kw.filesets"
edit = [{ find = "By default, `\"path\"` is parsed as a `prefix-glob:` pattern, which matches\ncwd-relative path prefix.\n\n", c = "By default, `\"path\"` is parsed as a `cwd:` pattern, which matches\ncwd-relative path prefix.\n\n", nm = "" }]

[[shape.claim]]
id = "dasel-3-version-flag-unknown"
fact = "dasel-version-flag"
text = "fact: in dasel 3.11.2, --version is not a flag; dasel rejects it as unknown."
version = "3.11.2"
scope_re = 'dasel \d+\.\d+\.\d+'
probes.support = ['dasel: error: unknown flag --version']
probes.contradict = ['''\$ dasel --version\n3\.11\.2\n\[exit 0\]''']
probes.mention = ['unknown flag --version', '\$ dasel --version']
edit_note = "c: dasel --version prints the version and exits 0; nm: that call is removed. The older-version note and `dasel version` are fixed."
[[shape.claim.scoped]]
notes = ["- fact (from notes kept under dasel 2.8.1): `dasel --version` prints the dasel version"]
verified_by = [{ capture = "old.dasel.version-flag", pattern = '^dasel version v2\.8\.1$' }]
[[shape.claim.block]]
capture = "dasel.version"
[[shape.claim.block]]
capture = "dasel.err.version-flag"
c_from = "dasel.version"
nm_drop = true

# ===================================================== environment facts

[[shape]]
id = "environment.tool-version"
type = "environment"

[[shape.claim]]
id = "jj-installed-0-46-0"
fact = "jj-version"
text = "fact: the jj on PATH is version 0.46.0."
touch = ['jj \d+\.\d+\.\d+-']
probes.near = ['gh version 2\.95\.0']
distractor = [{ capture = "gh.version" }]
value = "0.46.0"
value_c = "0.30.0"
probes.support = ['^jj 0\.46\.0-']
probes.contradict = ['^jj 0\.30\.0-']
probes.mention = ['^jj \d+\.\d+\.\d+-']
repeat = 0
edit_note = "c: jj --version reports 0.30.0 (the real output of that release); nm: the call is removed."
[[shape.claim.block]]
capture = "jj.version"
c_from = "old.jj.version"
nm_drop = true

[[shape.claim]]
id = "dasel-installed-3-11-2"
fact = "dasel-version-number"
text = "fact: the installed dasel is version 3.11.2."
touch = ['dasel version', '3\.1\d\.\d']
probes.near = ['^jj 0\.46\.0-']
distractor = [{ capture = "jj.version" }]
repeat = 0
value = "3.11.2"
value_c = "3.10.2"
probes.support = ['''\$ dasel version\n3\.11\.2\n''']
probes.contradict = ['''\$ dasel version\n3\.10\.2\n''']
probes.mention = ['''\$ dasel version\n''']
edit_note = "c: dasel version prints 3.10.2; nm: the call is removed."
[[shape.claim.block]]
capture = "dasel.version"
edit = [{ find = "\n3.11.2\n", c = "\n3.10.2\n" }]
nm_drop = true

[[shape.claim]]
id = "gh-installed-2-95-0"
fact = "gh-version"
text = "fact: gh 2.95.0 is installed."
touch = ['gh version']
probes.near = ['gh stack version 0\.2\.1']
distractor = [{ capture = "gh.stack.version" }]
repeat = 0
value = "2.95.0"
value_c = "2.94.0"
probes.support = ['gh version 2\.95\.0', 'tag/v2\.95\.0']
probes.contradict = ['gh version 2\.94\.0', 'tag/v2\.94\.0']
probes.mention = ['gh version \d']
edit_note = "c: both the version line and the release URL say 2.94.0; nm: the call is removed."
[[shape.claim.block]]
capture = "gh.version"
edit = [{ find = "2.95.0", c = "2.94.0", count = 2 }]
nm_drop = true

# A belief a later call superseded: SUPPORTED shows the tool output that
# backed it; CONTRADICTED shows it marked `was: …, wrong because …` beside
# the call that superseded it.
[[shape]]
id = "environment.superseded-belief"
type = "environment"
mechanism = "supersede"

[[shape.claim]]
id = "jj-installed-0-30-belief"
fact = "jj-version"
role = "belief"
text = "fact: the installed jj is 0.30.0."
touch = ['jj \d+\.\d+\.\d+-']
probes.support = ['^jj 0\.30\.0-', 'installed jj is 0\.30\.0']
probes.contradict = ['^jj 0\.46\.0-']
probes.mention = ['^jj \d+\.\d+\.\d+-', 'jj is 0\.30\.0']
edit_note = "s: jj --version prints 0.30.0 (a capture of that release); c: that belief is marked refuted beside a later jj --version printing 0.46.0; nm: neither."
[[shape.claim.block]]
capture = "old.jj.version"
c_drop = true
nm_drop = true
[[shape.claim.block]]
notes = []
c_notes = [
  "- was: the installed jj is 0.30.0 (held at 9/10), wrong because jj --version now prints 0.46.0 [call c41]",
  "- fact: jj 0.46.0 is installed",
]
[[shape.claim.block]]
capture = "jj.version"
call = "c41"
s_drop = true
nm_drop = true

[[shape]]
id = "environment.command-missing"
type = "environment"

[[shape.claim]]
id = "sandbox-nosuchtool-missing"
fact = "sandbox-nosuchtool"
text = "gotcha: nosuchtool isn't installed in this sandbox; the shell reports it as command not found."
