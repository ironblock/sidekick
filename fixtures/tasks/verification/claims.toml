probes.contradict = ['^Di,19,Kyiv\nEd,52,Lima$']
probes.mention = ['Kyiv', 'name,age,city']
edit_note = "c: a fifth record follows Di's; nm: the file listing is removed."
[[shape.claim.block]]
capture = "dasel.cat.users-csv"
edit = [{ find = "Di,19,Kyiv\n", c = "Di,19,Kyiv\nEd,52,Lima\n" }]
nm_drop = true

