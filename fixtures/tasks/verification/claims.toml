# A belief that the session later refuted: SUPPORTED holds it as a live fact,
# CONTRADICTED shows it marked `was: …, wrong because …` beside the call that
# refuted it.
[[shape]]
id = "tool.superseded-belief"
type = "tool"
mechanism = "supersede"

[[shape.claim]]
id = "jj-template-id-keyword-belief"
fact = "jj-template-id-keyword"
role = "belief"
text = "fact: jj templates have an `id` keyword, so id.short() prints a commit's short id."
probes.support = ['`id` keyword; `id\.short\(\)` prints']
probes.contradict = ["Keyword `id` doesn't exist"]
probes.mention = ['`id` keyword', 'Keyword `id`']
edit_note = "c: the note is marked refuted (was: …, wrong because …) and the refuting call c17 is shown; nm: neither."
[[shape.claim.block]]
notes = ["- fact: jj templates have an `id` keyword; `id.short()` prints a commit's short id"]
c_notes = [
  "- was: jj templates have an `id` keyword; `id.short()` prints a commit's short id (held at 8/10), wrong because jj rejected it: Keyword `id` doesn't exist [call c17]",
  "- fact: the commit id keyword in jj templates is `commit_id`",
]
nm_notes = []
[[shape.claim.block]]
capture = "jj.err.id-keyword"
call = "c17"
s_drop = true
nm_drop = true

[[shape.claim]]
id = "jj-file-show-rev-path-belief"
fact = "jj-file-show-rev-path"
role = "belief"
text = "fact: jj file show accepts a REV:PATH argument such as stable:soup.txt."
probes.support = ['`jj file show` accepts `REV:PATH`']
probes.contradict = ['Invalid file pattern kind `stable:`']
probes.mention = ['REV:PATH', 'Invalid file pattern']
edit_note = "c: the note is marked refuted beside the refuting call c52; nm: neither."
[[shape.claim.block]]
notes = ["- fact: `jj file show` accepts `REV:PATH`, as in `stable:soup.txt`"]
c_notes = [
  "- was: `jj file show` accepts `REV:PATH`, as in `stable:soup.txt` (held at 7/10), wrong because it failed with Invalid file pattern kind `stable:` [call c52]",
  "- fact: `jj file show` takes the revision as `-r REV` and the path as a fileset",
]
nm_notes = []
[[shape.claim.block]]
capture = "jj.err.file-show-colon"
call = "c52"
s_drop = true
nm_drop = true

# A statement scoped to a version, beside notes about an older version that
# say otherwise. The version the haystack shows decides.
[[shape]]
id = "tool.version-scoped"
type = "tool"
mechanism = "version"

[[shape.claim]]
id = "jj-bare-fileset-path-prefix-glob"
fact = "jj-fileset-bare-path"
edit = "fabricated"
text = "fact: in jj 0.46, a bare path in a fileset is parsed as a prefix-glob: pattern."
version = "0.46.0"
scope_re = 'jj 0\.\d+\.\d+'
probes.support = ['parsed as a `prefix-glob:` pattern']
probes.contradict = ['parsed as a `cwd:` pattern']
probes.mention = ['By default, `"path"` is parsed']
edit_note = "c: the 0.46 documentation says a bare path is a cwd: pattern; nm: that sentence is removed. The older-version note is fixed in all three."
[[shape.claim.scoped]]
notes = ["- fact (from notes kept under jj 0.30.0): a bare `\"path\"` in a fileset means the same as `cwd:\"path\"`, a cwd-relative path prefix"]
verified_by = [
  { capture = "old.jj.version", pattern = '^jj 0\.30\.0-' },
  { capture = "old.jj.help.kw.filesets", pattern = '`"path"` or `cwd:"path"`: Matches cwd-relative path prefix' },
]
[[shape.claim.block]]
capture = "jj.version"
[[shape.claim.block]]
capture = "jj.help.kw.filesets"
edit = [{ find = "By default, `\"path\"` is parsed as a `prefix-glob:` pattern, which matches\ncwd-relative path prefix.\n\n", c = "By default, `\"path\"` is parsed as a `cwd:` pattern, which matches\ncwd-relative path prefix.\n\n", nm = "" }]

[[shape.claim]]
id = "dasel-3-version-flag-unknown"
fact = "dasel-version-flag"
text = "fact: in dasel 3.11.2, --version is not a flag; dasel rejects it as unknown."
version = "3.11.2"
scope_re = 'dasel \d+\.\d+\.\d+'
probes.support = ['dasel: error: unknown flag --version']
probes.contradict = ['''\$ dasel --version\n3\.11\.2\n\[exit 0\]''']
probes.mention = ['unknown flag --version', '\$ dasel --version']
edit_note = "c: dasel --version prints the version and exits 0; nm: that call is removed. The older-version note and `dasel version` are fixed."
[[shape.claim.scoped]]
notes = ["- fact (from notes kept under dasel 2.8.1): `dasel --version` prints the dasel version"]
verified_by = [{ capture = "old.dasel.version-flag", pattern = '^dasel version v2\.8\.1$' }]
[[shape.claim.block]]
capture = "dasel.version"
[[shape.claim.block]]
capture = "dasel.err.version-flag"
c_from = "dasel.version"
nm_drop = true

