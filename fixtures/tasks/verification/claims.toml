probes.near = ['command -v jq']
distractor = [{ capture = "gen.env.command-v-jq" }]
repeat = 0
probes.support = ['nosuchtool: command not found']
probes.contradict = ['nosuchtool: Permission denied']
probes.mention = ['nosuchtool']
edit_note = "c: a nosuchtool is on PATH but not executable, so the shell says Permission denied (exit 126; the shell's own output with such a file in place); nm: both calls are removed."
[[shape.claim.block]]
capture = "gen.env.missing-tool"
c_from = "gen.env-noexec.missing-tool"
nm_drop = true
[[shape.claim.block]]
capture = "gen.env.command-v"
nm_drop = true

[[shape]]
id = "environment.write-refused"
type = "environment"

[[shape.claim]]
id = "sandbox-ro-dir-read-only"
fact = "sandbox-ro-dir"
text = "gotcha: the ro directory is read-only here; mkdir inside it fails with Permission denied."
touch = ['\bro/']
probes.near = ['mkdir \.scratch']
distractor = [{ capture = "gen.env.mkdir-local" }]
repeat = 0
probes.support = ['ro/scratch: Permission denied']
probes.contradict = ['''\$ mkdir ro/scratch\n\[exit 0\]''']
probes.mention = ['ro/scratch']
edit_note = "c: the mkdir succeeds silently with exit 0 (run where ro is writable); nm: the call is removed."
[[shape.claim.block]]
capture = "gen.env.mkdir-ro"
c_from = "gen.env-rw.mkdir-ro"
nm_drop = true

[[shape]]
id = "environment.remote-unavailable"
type = "environment"

[[shape.claim]]
id = "gh-stack-submit-exit-4"
fact = "gh-stack-submit-remote"
text = "gotcha: gh stack submit fails here with exit status 4: it can't create a GitHub client because no remote points to a GitHub host."
touch = ['gh stack submit']
probes.near = ['requires an interactive terminal']
distractor = [{ capture = "gh.stack.err.switch" }]
repeat = 0
value = "[exit 4]"
value_c = "[exit 1]"
guard = []
probes.support = ['known GitHub host\n\[exit 4\]']
probes.contradict = ['known GitHub host\n\[exit 1\]']
probes.mention = ['failed to create GitHub client']
edit_note = "c: the same failure exits 1; nm: the call is removed."
[[shape.claim.block]]
capture = "gh.stack.err.submit"
edit = [{ find = "[exit 4]\n", c = "[exit 1]\n" }]
nm_drop = true

[[shape]]
id = "environment.declared-constraint"
type = "environment"

[[shape.claim]]
id = "service-ports-taken"
fact = "service-ports-taken"
text = "constraint: ports 5173, 5180 and 5181 are already taken on this host."
touch = ['ports? 51\d\d', '518\d']
repeat = 0
probes.support = ['ports 5173, 5180 and 5181 are already in use']
probes.contradict = ['ports 5173, 5180 and 5181 are free']
probes.mention = ['5181']
edit_note = "c: the config comment says those ports are free; nm: the comment line is removed."
[[shape.claim.block]]
capture = "gen.service.cat"
edit = [
  { find = "ports 5173, 5180 and 5181 are already in use on this host", c = "ports 5173, 5180 and 5181 are free on this host" },
  { find = "# service settings; ports 5173, 5180 and 5181 are already in use on this host\n", nm = "" },
]

# ========================================================== file facts

[[shape]]
id = "file.table-of-records"
type = "file"

[[shape.claim]]
id = "app-toml-three-services"
fact = "app-toml-services"
worked = true
text = "fact: app.toml defines three [[services]] tables: api with 3 replicas, worker with 5 and cron with 1."
touch = ['\[\[services\]\]', 'replicas']
probes.support = ['^name = "worker"\nreplicas = 5$', '"name": "worker",\n\s+"replicas": 5,']
probes.contradict = ['^name = "worker"\nreplicas = 6$', '"name": "worker",\n\s+"replicas": 6,']
probes.mention = ['\[\[services\]\]', '"replicas"', 'replicas = ']
invariants = [{ type = "sum", items = '^replicas = (\d+)$', total = '''sum\(services\.map\(replicas\)\.\.\.\)' < app\.toml\n(\d+)\n''' }]
edit_note = "c: the worker runs 6 replicas, and the sum (10) and JSON view come from rerunning dasel on that file; nm: app.toml has no [[services]] tables (the [database] section stays) and the derived views are removed."
[[shape.claim.block]]
capture = "dasel.cat.app-toml"
c_from = "dasel.worker6.cat.app-toml"
nm_from = "dasel.noservices.cat.app-toml"
[[shape.claim.block]]
capture = "dasel.sum-replicas"
c_from = "dasel.worker6.sum-replicas"
nm_drop = true
[[shape.claim.block]]
capture = "dasel.services-json"
c_from = "dasel.worker6.services-json"
nm_drop = true

