# Claims for the verification corpus, grouped by claim shape.
#
# A claim is one fact an agent might record about its session, and its
# needle: the blocks of evidence that state it, with what each variant does
# to them. SUPPORTED shows the blocks as captured; CONTRADICTED makes the
# minimal edit that flips the claim in every copy; NOT MENTIONED removes
# every copy. tools/tasks/hazards.py checks each generated triple against
# the probes below and refuses it on any hazard.
#
# Fields (see fixtures/tasks/verification/schema.json, `claim` and `block`):
# - `block`: needle blocks in text order. `capture` names a capture; `notes`
#   is authored working notes. Per variant v (s, c, nm): `<v>_from` takes the
#   output from a sibling world's capture under the same command line,
#   `<v>_notes` replaces the notes, `<v>_drop` removes the block,
#   `<v>_empty` keeps the command and exit status with no output. `edit`
#   replaces `find` in the variants it names. `role` (winner, loser) and
#   `group` (a, b) place the two slots of a "which is current" mechanism.
# - `probes`: regular expressions over the evidence. `support` states the
#   claim, `contradict` states its edited form, `mention` is anything else
#   NOT MENTIONED must not contain, `near` is what a near-miss distractor
#   shares with the claim. Filler that matches any probe or `guard` literal
#   is never drawn.
# - `exclude`: captures never used as filler for this claim because they are
#   derived views of the needle (a count, a graph that implies the result).
#
# Claim wording is this corpus's own. Each claim shape follows a kind of
# entry a host project's agents write; instances vary the tool and fact.

schema = "sidekick-verification-claims/1"

# ============================================================ tool facts

[[shape]]
id = "tool.refusal-names-override"
type = "tool"

[[shape.claim]]
id = "jj-bookmark-move-allow-backwards"
fact = "jj-bookmark-move-backwards"
edit = "fabricated"
worked = true
text = "gotcha: jj bookmark move won't move a bookmark backwards or sideways unless it gets --allow-backwards."
value = "--allow-backwards"
value_c = "--force"
probes.support = ['Use --allow-backwards to allow it', '^  -B, --allow-backwards$']
probes.contradict = ['Use --force to allow it', '^  -F, --force$']
probes.mention = ['backwards or sideways', 'allow-backwards']
edit_note = "c: the refusal's Hint and the help's option line name --force (-F) instead; nm: the Error and Hint lines and the whole option entry are removed, the command and its exit status stay."
[[shape.claim.block]]
capture = "jj.err.bookmark-move-backwards"
edit = [
  { find = "Hint: Use --allow-backwards to allow it.\n", c = "Hint: Use --force to allow it.\n" },
  { find = "Error: Refusing to move bookmark backwards or sideways: menu\nHint: Use --allow-backwards to allow it.\n", nm = "" },
]
[[shape.claim.block]]
capture = "jj.help.bookmark-move"
edit = [
  { find = "  -B, --allow-backwards\n", c = "  -F, --force\n", count = 1 },
  { find = "  -B, --allow-backwards\n          Allow moving bookmarks backwards or sideways\n\n", nm = "" },
]

[[shape]]
id = "tool.flag-not-accepted"
