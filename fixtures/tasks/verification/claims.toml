probes.contradict = ['''\$ gh stack submit --draft\nChecking stack state''']
probes.mention = ['--draft']
exclude = ["gh.stack.help.submit"]
edit_note = "c: the command runs past flag parsing (gh stack submit's own output, failing later on the remote); nm: the call is removed."
[[shape.claim.block]]
capture = "gh.stack.err.submit-draft"
c_from = "gh.stack.err.submit"
nm_drop = true

