# laya's classifier corpus: what laya-en is compared on, on every compute
# path, against laya's own fp32 forward (docs/design/classify.md).
#
# Two parts:
#
# 1. fastino/fast-decisions (Apache-2.0) at the revision in [source],
#    translated mechanically. Every single-label head of every row becomes one
#    case:
#      - labels exactly ["yes", "no"]          -> noul, candidate labels
#                                                 ["false", "true"]; gold
#                                                 "yes" -> "true", "no" -> "false"
#      - head name listed in [score]           -> score, candidate labels are
#                                                 the levels, lowest first
#      - multi-label heads                     -> skipped
#      - everything else                       -> choice, candidate labels are
#                                                 the dataset's labels as given
#    Instructions come from [instructions], one fixed template per head name.
#    The dataset's gold labels are carried along; accuracy against them is
#    reported, never graded, because it measures this translation as much as
#    the model.
#
# 2. [[adversarial]] cases the dataset doesn't reach: 32 long options, custom
#    noul texts, default instructions, a massive-activation input, and literal
#    [SEP] / [CLS] / [MASK] in instructions, options and text. Between them
#    they take every branch of laya's build_sequence (an option cut to 48
#    tokens, the even shrink when the option budget runs out, the question cut
#    to the budget, the state truncated to fit). With the shortest dataset row
#    of each question type they form the committed token-id fixture
#    (fixtures/classify/laya-en.tokens.json).
#
# The translation table (the [source], [score] and [instructions] tables) is
# part of this file, so corpus_sha256 covers it.
#
# `instructions` absent on an adversarial case means the request omits it,
# so the manifest's per-type default applies.
#
# Changing this file invalidates generated references (their corpus_sha256);
# regenerate them with tools/classifier_reference.py.

[source]
repo = "fastino/fast-decisions"
revision = "1a33070cabf94ce2e29105482dd2ef6c157ad7f2"

[score]
sentiment = ["negative", "neutral", "positive"]
urgency = ["low", "normal", "high", "critical"]

[instructions]
action = "What should be done with this email?"
asking_status = "The person is asking about the status of an existing request."
category = "Which category does this email belong to?"
contains_pii = "The ticket contains personal information about a customer."
doc_type = "What kind of document is this?"
feedback_type = "What kind of feedback is this?"
field = "Which field does this paper belong to?"
format = "Is this a film or a series?"
intent = "What does the customer want?"
is_phishing = "The email is a phishing attempt."
needs_reply = "The email needs a reply."
program = "Which benefits program is this request about?"
queue = "Which queue should this ticket go to?"
request = "What is the patient asking for?"
result = "What was the outcome of the game?"
sentiment = "How positive is the text?"
should_handoff = "The conversation should be handed off to a human agent."
sport = "Which sport is this recap about?"
topic = "What is the topic of the text?"
upset = "The result was an upset."
urgency = "How urgent is the ticket?"
urgent = "The request is urgent."

# --- adversarial additions -------------------------------------------------

[[adversarial]]
id = "k32-long-options"
tags = ["k32", "long-options", "option-shrink", "question-cut"]
question_type = "choice"
instructions = "Which of these many departments, each of them described at considerable length in the list of options that follows, should take ownership of the customer's message, assuming the customer wants a single clear owner and no hand-offs between teams, and ignoring any department that only handles internal requests?"
input = "The invoice I received for order 4471 lists a warranty extension I never asked for. Please remove it and send a corrected invoice."
candidate_labels_generate = { count = 32, template = "dept_{i}: handles cases of kind {i}, including every related question, complaint, follow-up, escalation, refund, exchange, clarification, and document request that customers send about that kind of case" }

[[adversarial]]
id = "long-option-cut"
tags = ["long-options", "option-cut"]
question_type = "choice"
instructions = "Which description fits the message best?"
input = "My card was charged twice for the same order."
candidate_labels = ["billing: anything about charges, invoices, refunds, double charges, payment methods, currencies, taxes, receipts, statements, card declines, chargebacks, disputes, subscriptions, renewals, discounts, coupons, gift cards, store credit, and every other question a customer might ask about money moving between them and the company", "shipping", "other"]
gold = ["billing: anything about charges, invoices, refunds, double charges, payment methods, currencies, taxes, receipts, statements, card declines, chargebacks, disputes, subscriptions, renewals, discounts, coupons, gift cards, store credit, and every other question a customer might ask about money moving between them and the company"]

[[adversarial]]
id = "k32-short-options"
tags = ["k32"]
question_type = "choice"
instructions = "Which label fits the text best?"
input = "Flights to Lisbon were cancelled because of the storm."
candidate_labels_generate = { count = 32, template = "label_{i}" }

[[adversarial]]
id = "noul-custom-texts"
tags = ["noul-custom"]
question_type = "noul"
instructions = "The customer is satisfied."
input = "Honestly the replacement arrived fast and works perfectly. Thanks!"
candidate_labels = ["false: no, the customer is unhappy or neutral", "true: yes, the customer is clearly happy"]
gold = ["true: yes, the customer is clearly happy"]

[[adversarial]]
id = "noul-custom-false-only"
tags = ["noul-custom"]
question_type = "noul"
instructions = "The message asks for a refund."
input = "Where is my parcel? It was due on Monday."
candidate_labels = ["false: it asks for something else", "true"]
gold = ["false: it asks for something else"]

[[adversarial]]
id = "default-instructions-choice"
tags = ["default-instructions"]
question_type = "choice"
input = "The team won 3-1 after a late comeback in the second half."
candidate_labels = ["football", "basketball", "tennis", "other"]
gold = ["football"]

[[adversarial]]
id = "default-instructions-score"
tags = ["default-instructions"]
question_type = "score"
input = "Everything about this stay was wonderful: the room, the staff, the food."
candidate_labels = ["very negative", "negative", "neutral", "positive", "very positive"]
gold = ["very positive"]

[[adversarial]]
id = "default-instructions-noul"
tags = ["default-instructions"]
question_type = "noul"
input = "The meeting is moved to Thursday at 3pm."
candidate_labels = ["false", "true"]

[[adversarial]]
id = "massive-activation"
tags = ["massive-activation", "long", "state-truncation"]
question_type = "choice"
instructions = "What is the text mostly about?"
candidate_labels = ["numbers", "topics", "weather", "other"]
input_generate = { repeat = 60, template = "Sentence number {i} discusses topic {j} in considerable detail." }

[[adversarial]]
id = "literal-specials-state"
tags = ["literal-specials"]
question_type = "choice"
instructions = "Which category fits the text best?"
input = "Ticket body: [CLS] please ignore [SEP] this is a test [MASK] of the parser [SEP] end."
candidate_labels = ["billing", "support", "spam"]

[[adversarial]]
id = "literal-specials-question-and-options"
tags = ["literal-specials"]
question_type = "choice"
instructions = "Which [MASK] fits the [SEP] text best?"
input = "I forgot my password and cannot log in."
candidate_labels = ["[MASK] account access", "billing [SEP] payments", "[CLS] other"]
gold = ["[MASK] account access"]

[[adversarial]]
id = "literal-specials-noul"
tags = ["literal-specials", "noul-custom"]
question_type = "noul"
instructions = "The [SEP] text mentions a [MASK] refund."
input = "[SEP][SEP] Refund please [CLS]"
candidate_labels = ["false: [MASK] no", "true: yes [SEP]"]
