# Shared parity corpus: the inputs every embedding path is compared on.
#
# tools/parity_reference.py materializes this file for one model (applying
# its tokenizer, prefixes and buckets) and records the reference vectors;
# the parity suite (crates/sidekick-embed/examples/parity) runs the same
# inputs through sidekick and grades the result. See docs/MODELS.md.
#
# Each case is chosen to exercise a failure mode seen on a real model, named
# in its tags:
#
#   pad-heavy      few real tokens in a large bucket. A dropped attention
#                  mask (ModernBERT's fused attention on the ANE) or a
#                  convolution reading pad states (LFM2.5) shows up here, and
#                  in the suite's pad- and bucket-invariance gates.
#   boundary       exactly bucket-1 / bucket / bucket+1 tokens: bucket
#                  selection, and the most padding a bucket ever sees.
#   beyond-window  longer than ModernBERT's 128-token sliding window, so the
#                  local attention mask actually masks something.
#   over-length    longer than the largest bucket: truncation must keep the
#                  final token, which last-token pooling reads (F2LLM).
#   tiny           two to five tokens: the pooled token has almost no
#                  context.
#   delimiters     punctuation, newlines and special-token strings, where
#                  massive activations live (gte-modernbert ~48,000;
#                  EmbeddingGemma ~152,000, beyond fp16).
#   degenerate     one token repeated: attention spread evenly over
#                  identical keys.
#   long           deep fp16 accumulation over hundreds of tokens.
#   multilingual, code, numbers
#                  vocabulary and activation profiles English prose doesn't
#                  reach.
#   query          the query prefix path (models with asymmetric prompts).
#   similarity     topic pairs and queries whose similarity order the paths
#                  must preserve.
#
# A case has either `text` or `length`. `length` is a total token count,
# prefix and special tokens included, reached by taking words from
# [filler] until the tokenizer reports exactly that many: an integer, or
# { bucket = i, offset = n } for (the model's i-th bucket) + n, where
# i = -1 is the largest. `purpose` defaults to "document".
#
# Changing this file invalidates every generated reference (the suite checks
# its hash); regenerate them with tools/parity_reference.py.

