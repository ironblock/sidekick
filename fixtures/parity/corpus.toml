# --- filler ----------------------------------------------------------------------------------

# Words for `length` cases, taken in order (repeated if a target needs more).
# Varied, ordinary prose: no special tokens, so lengths are predictable.
[filler]
text = """
The lighthouse stood at the end of a narrow spit of land, and for most of the year the only
visitors were gulls and the occasional surveyor. Its keeper kept a log of the weather, the
ships that passed, and the small repairs that a building exposed to salt and wind always needs.
In winter the storms came from the north and the waves broke over the lower gallery; in summer
the fog rolled in each evening and the horn sounded every thirty seconds until dawn. Over the
decades the log filled dozens of volumes. Historians later used it to reconstruct shipping
patterns along the coast, because the keeper had noted not only the names of vessels but their
cargo, their direction, and how heavily they sat in the water. A bakery in the nearby town
still sells a bread named after the lighthouse, although few of its customers know why. The
recipe calls for rye flour, caraway seeds, a little molasses, and a long, slow rise in a cool
kitchen. Engineers who studied the tower found that its foundation had shifted by less than a
centimeter in a hundred years, a result they attributed to the careful choice of granite and
to drainage channels cut into the rock by the original builders. Modern instruments now measure
wind speed, pressure, and visibility automatically, and the data flows to a regional forecasting
center where models combine it with satellite images and reports from buoys offshore. The keeper
retired long ago, but volunteers still climb the spiral staircase on weekends to polish the
brass, wind the old clock, and show children how the great lens concentrates a small flame into
a beam visible for twenty nautical miles. Visitors often ask how the lens works. Rings of glass
prisms bend the light toward the horizon, so that almost none of it is wasted on the sky or the
sea at the foot of the tower. The design was a breakthrough in its day, and variations of it are
still used in theater spotlights, overhead projectors, and the headlights of some cars. When the
museum opened, the town held a festival with music, a market, and a race along the beach path.
The race has become an annual tradition. Runners start at the harbor, follow the shoreline past
the dunes, and finish at the foot of the lighthouse, where a table of sandwiches, fruit, and
lemonade waits for them. Some years the weather cooperates and the finish line glows in the late
afternoon sun; other years the runners arrive soaked and laughing, their shoes full of sand.
Either way, the event raises money for the upkeep of the tower and for a scholarship that sends
one local student each year to study marine science at the university in the capital. Several
former scholarship holders now work on ocean monitoring projects, measuring temperature, salinity,
and currents with autonomous gliders that surface every few hours to transmit their readings.
Their work has shown that the waters near the spit are warming faster than the regional average,
which affects the fish that local boats depend on and the seabirds that nest on the cliffs.
The town council has begun planning for higher tides, raising the harbor wall and restoring the
salt marsh behind the dunes, which absorbs storm surges and shelters young fish. Progress is slow,
and the budget is small, but the lighthouse remains a symbol of the idea that careful observation,
patiently recorded, can help a community understand and adapt to the changes around it.
"""
