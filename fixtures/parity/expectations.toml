# What the parity suite (crates/sidekick-embed/examples/parity) enforces.
# See docs/MODELS.md for how to run it and read its report.
#
# [gates] hold for every model on every chip: a failure means a broken
# artifact or a broken product path, not a less accurate one.
#
# [[floor]] entries are regression tests for accuracy, measured per chip
# because each generation of Neural Engine rounds differently. A floor is
# the measured value less a margin proportional to the measured error
# (`--suggest-floors` prints them from a run). On a chip with no floors the
# suite enforces the gates and reports accuracy without judging it.

[gates]
# Cosine between a case's output in its natural bucket and in every larger
# one. The CPU path is bitwise bucket-invariant; the GPU and ANE compile
# each bucket separately. On the ANE, precision lost in a model's MLP shows
# up here too: EmbeddingGemma measured 0.9977 and LFM2.5 0.9965 before their
# precision rewrites (D17, D19), and the ANE gate was 0.995 to admit them.
# Since the rewrites every model measures at least 0.99995 on the ANE (M1
# Max, macOS 27.0), so the ANE gate matches the GPU's. A dropped attention
# mask measured 0.40-0.94.
#
# Except Core ML's CPU on an Intel Mac (cpu-x86_64): it rounds the last,
# partial output tile of the attention-score matmul differently by bucket,
# one fp16 ulp in a few scores of inputs that nearly fill their bucket
# (tools/repro_cpu_matmul_tail.py). bge-small measured 0.99999910 on a Xeon
# W-3235; the gate there is 0.99999 (D38 amendment, October 2026). The
# classifier gate's Intel value is in classify_grade.rs.
bucket_invariance = { cpu = 0.999999, cpu-x86_64 = 0.99999, gpu = 0.9999, ane = 0.9999 }
# Cosine between pad ids 0 and random pad ids in the same bucket: the mask
# hides pads, so nothing may change.
pad_invariance = 0.99999
# Cosine between two ANE runs of the same inputs in separate processes.
determinism = 0.999999
# Similarity gap below which a path may reorder two candidates (report only).
rank_margin = 0.02

[grades]
# The letter scales: the one definition the parity suite and
# tools/models_table.py (docs/MODELS.md, docs/data/models.json and the
# comparison page) all read. A letter describes accuracy and is never a
# gate; F means a hard gate failed or the output wasn't finite.
#
# Embedders: the worst-case cosine against the fp32 reference, at least.
# A is indistinguishable from fp32.
cosine = { A = 0.9999, B = 0.999, C = 0.985 }
# Classifiers: the worst |Δp| against the fp32 reference, at most. A graded
# argmax flip caps the grade at C.
dp = { A = 1e-3, B = 5e-3, C = 2e-2 }
# Classifiers whose reference carries the ideal-fp16 ceiling: the p99 |Δp|
# as a multiple of the ceiling's p99, at most. Such a classifier gets the
# better of this and its dp grade.
ratio = { A = 1.25, B = 2.0, C = 4.0 }

