# What the parity suite (crates/sidekick-embed/examples/parity) enforces.
# See docs/MODELS.md for how to run it and read its report.
#
# [gates] hold for every model on every chip: a failure means a broken
# artifact or a broken product path, not a less accurate one.
#
# [[floor]] entries are regression tests for accuracy, measured per chip
# because each generation of Neural Engine rounds differently. A floor is
# the measured value less a margin proportional to the measured error
# (`--suggest-floors` prints them from a run). On a chip with no floors the
# suite enforces the gates and reports accuracy without judging it.

[gates]
# Cosine between a case's output in its natural bucket and in every larger
# one. The CPU path is bitwise bucket-invariant; the GPU and ANE compile
# each bucket separately, and the ANE's fp16 accumulation order follows the
# tiling (EmbeddingGemma and LFM2.5 measure ~0.998). A dropped attention
# mask measured 0.61-0.94.
bucket_invariance = { cpu = 0.999999, gpu = 0.9999, ane = 0.995 }
# Cosine between pad ids 0 and random pad ids in the same bucket: the mask
# hides pads, so nothing may change.
pad_invariance = 0.99999
# Cosine between two ANE runs of the same inputs in separate processes.
determinism = 0.999999
# Similarity gap below which a path may reorder two candidates (report only).
rank_margin = 0.02

# Apple M1 Max, macOS 27.0 (September 2026). The ANE floors for
# embeddinggemma-300m and lfm2.5-embedding-350m are grade D: see
# docs/MODELS.md "Confidence grades" and D26.

[[floor]]
chip = "Apple M1 Max"
model = "bge-small-en-v1.5"
path = "cpu"
worst = 0.999893
stress = 0.999974
drift = 0.003907

