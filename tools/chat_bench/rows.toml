# K2-Horizon is a reasoning model with no non-thinking mode: its chat template
# always opens a thinking block. Its architecture is in its repository's own
# PyTorch code only, so it runs on serve_ref's torch backend (MPS, bf16).
[[row]]
id = "k2-horizon-0.9b-nothink"
label = "K2-Horizon-0.9B, empty thinking block"
server = "serve_ref"
backend = "torch"
repo = "IFM/K2-Horizon-0.9B"
revision = "7c75f2f49e74ac97c1852e62b4c860091d6a00ea"
chat_template_args = { reasoning_effort = "low" }
think_tags = ["<ifm|think_faster>", "</ifm|think_faster>"]
prefill = "</ifm|think_faster>\\n"
json = "prompt"

[[row]]
id = "k2-horizon-0.9b-low"
label = "K2-Horizon-0.9B, low effort, thinking capped at 256 tokens"
server = "serve_ref"
backend = "torch"
repo = "IFM/K2-Horizon-0.9B"
revision = "7c75f2f49e74ac97c1852e62b4c860091d6a00ea"
chat_template_args = { reasoning_effort = "low" }
think_tags = ["<ifm|think_faster>", "</ifm|think_faster>"]
reasoning_budget = 256
# Thinking tokens count toward max_tokens: each family's limit plus the budget
# and the forced close.
extra_max_tokens = 264
json = "prompt"

# The model card's recommended effort, with thinking capped (budget forcing).
[[row]]
id = "k2-horizon-0.9b-high"
label = "K2-Horizon-0.9B, high effort, thinking capped at 512 tokens"
server = "serve_ref"
backend = "torch"
repo = "IFM/K2-Horizon-0.9B"
revision = "7c75f2f49e74ac97c1852e62b4c860091d6a00ea"
chat_template_args = { reasoning_effort = "high" }
think_tags = ["<ifm|think>", "</ifm|think>"]
reasoning_budget = 512
extra_max_tokens = 520
json = "prompt"

# The causal-LM task check (tools/chat_bench/task_check.py, D54): a converted
# build served by sidekickd against the checkpoint itself in fp32 on the CPU,
# on the same seeded sample, prompt-only JSON on both, greedy on both.
[[row]]
id = "minicpm5-2b-ane"
label = "MiniCPM5-2B, sidekick's kv-state-1 build on the ANE"
server = "sidekick"
model = "minicpm5-2b"
json = "prompt"

[[row]]
id = "minicpm5-2b-fp32"
label = "MiniCPM5-2B, fp32 transformers on the CPU (the conversion's reference)"
server = "serve_ref"
backend = "torch"
dtype = "float32"
device = "cpu"
repo = "openbmb/MiniCPM5-2B"
revision = "f97400052a43d642bbc6e9975e2397e3ae6a6b52"
chat_template_args = { enable_thinking = false }
json = "prompt"

# LFM3-1.7B against MiniCPM5-2B on one serving stack. LFM3's architecture
# (gated short convolutions, sliding-window and full attention) is in its
# repository's own PyTorch code only, so both models run here on serve_ref's
# torch backend (MPS, bf16), prompt-only and guided. LFM3's chat template opens
# a `<think>` block by default; `enable_thinking: false` puts an empty one in
# the generation prompt instead (its card says that can be inconsistent).
[[row]]
id = "minicpm5-2b-torch"
label = "MiniCPM5-2B on serve_ref (PyTorch, MPS), control for the LFM3 rows"
server = "serve_ref"
backend = "torch"
