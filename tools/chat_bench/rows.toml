# The chat benchmark's rows: one model, served one way (tools/chat_bench/run.py).
#
# server   "sidekick"   a chat model of a running sidekickd (`--base-url`)
# model    sidekick rows: the chat model's id (default "apple-fm", Foundation Models)
#          "mlx_lm"     mlx_lm.server over the repository's own weights, started by run.py
#          "serve_ref"  tools/chat_bench/serve_ref.py (torch or mlx backend), started by run.py
# json     "guided"     JSON families send response_format json_schema (constrained decoding)
#          "prompt"     JSON families rely on the prompt alone
# families the request families to run (default: all)
# Open-model weights are the repository's bf16 weights, unquantised: the rows
# measure the model, not a conversion of it.

[[row]]
id = "afm"
label = "Foundation Models, guided JSON"
server = "sidekick"
json = "guided"

[[row]]
id = "afm-prompt"
label = "Foundation Models, prompt-only JSON"
server = "sidekick"
json = "prompt"
families = ["tags_vocab", "extraction"]

# A diagnostic, not a candidate: the guided row with every schema property
# marked required in response_format (the prompt is unchanged).
[[row]]
id = "afm-required"
label = "Foundation Models, guided JSON, all properties required"
server = "sidekick"
json = "guided"
schema_all_required = true
families = ["extraction"]

