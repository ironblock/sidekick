# K2-Horizon is a reasoning model with no non-thinking mode: its chat template
# always opens a thinking block. Its architecture is in its repository's own
# PyTorch code only, so it runs on serve_ref's torch backend (MPS, bf16).
[[row]]
id = "k2-horizon-0.9b-nothink"
label = "K2-Horizon-0.9B, empty thinking block"
server = "serve_ref"
backend = "torch"
repo = "IFM/K2-Horizon-0.9B"
revision = "7c75f2f49e74ac97c1852e62b4c860091d6a00ea"
chat_template_args = { reasoning_effort = "low" }
think_tags = ["<ifm|think_faster>", "</ifm|think_faster>"]
prefill = "</ifm|think_faster>\\n"
json = "prompt"

[[row]]
id = "k2-horizon-0.9b-low"
label = "K2-Horizon-0.9B, low effort, thinking capped at 256 tokens"
server = "serve_ref"
backend = "torch"
repo = "IFM/K2-Horizon-0.9B"
revision = "7c75f2f49e74ac97c1852e62b4c860091d6a00ea"
chat_template_args = { reasoning_effort = "low" }
think_tags = ["<ifm|think_faster>", "</ifm|think_faster>"]
reasoning_budget = 256
# Thinking tokens count toward max_tokens: each family's limit plus the budget
# and the forced close.
extra_max_tokens = 264
json = "prompt"

# The model card's recommended effort, with thinking capped (budget forcing).
[[row]]
id = "k2-horizon-0.9b-high"
label = "K2-Horizon-0.9B, high effort, thinking capped at 512 tokens"
server = "serve_ref"
backend = "torch"
repo = "IFM/K2-Horizon-0.9B"
revision = "7c75f2f49e74ac97c1852e62b4c860091d6a00ea"
chat_template_args = { reasoning_effort = "high" }
think_tags = ["<ifm|think>", "</ifm|think>"]
reasoning_budget = 512
extra_max_tokens = 520
json = "prompt"
