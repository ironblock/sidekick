backend = "torch"
constrained = true
repo = "openbmb/MiniCPM5-2B"
revision = "f97400052a43d642bbc6e9975e2397e3ae6a6b52"
chat_template_args = { enable_thinking = false }
json = "guided"
families = ["tags_vocab", "extraction"]

