# MoritzLaurer/ModernBERT-large-zeroshot-v2.0: a 28-layer ModernBERT-large
# zero-shot NLI classifier (Apache-2.0 card; 8,192-token context), two
# classes, entailment and not_entailment, mean-pooled.
#
# LICENCE NOTE: trained partly on ANLI (CC BY-NC 4.0); whether that
# restriction applies to the weights is unsettled; treat as non-commercial
# unless you've cleared it. sidekick supports this model but doesn't
# recommend it by default: the zeroshot-v2.0 "-c" models, trained only on
# commercially-friendly data, are the recommended set.
#
# As a Core ML zero-shot classifier in the nli format: one static-shape
# artifact per sequence-length bucket ({seq} resolves against `buckets`),
# each scoring one (premise, hypothesis) pair and returning the model's 2
# logits, (1, 2). sidekick builds a hypothesis per candidate label from
# `hypothesis_template` and scores the labels as transformers'
# ZeroShotClassificationPipeline does (docs/design/classify.md, "The nli
# format"). Its tokenizer config says 512, though the model takes 8,192;
# buckets stop at 2,048 for now.
#
# Produce the artifacts with tools/convert_nli.py:
#   python tools/convert_nli.py <checkpoint> <models>/modernbert-large-zeroshot-v2.0
# [classify.nli]'s indices are the pipeline's own resolution of the
# checkpoint's label2id; the converter checks them.

id = "modernbert-large-zeroshot-v2.0"
task = "zero-shot-classification"
source = { repo = "MoritzLaurer/ModernBERT-large-zeroshot-v2.0", revision = "a51e07b524299e309dd2b88d48b0cfa2bd9ec598" }
artifact = "model_{seq}.mlmodelc"
tokenizer = "tokenizer.json"
buckets = [128, 256, 512, 1024, 2048]
max_seq_len = 2048
max_batch = 8
problem_type = "single_label"
compute_units = "cpu_and_gpu"

[classify]
format = "nli"
max_labels = 16

[classify.nli]
entailment = 0
contradiction = 1
n_classes = 2
hypothesis_template = "This example is {}."

[classify.io]
input_ids = "input_ids"
attention_mask = "attention_mask"
output = "logits"
