# cross-encoder/nli-MiniLM2-L6-H768: a 6-layer RoBERTa-architecture MiniLMv2 NLI cross-encoder
# (82M parameters, hidden 768; Apache-2.0; trained on MultiNLI and SNLI), as a Core ML zero-shot classifier in the
# nli format: one static-shape artifact per sequence-length bucket ({seq}
# resolves against `buckets`), each scoring one (premise, hypothesis) pair
# and returning the model's 3 NLI logits, (1, 3). sidekick builds a
# hypothesis per candidate label from `hypothesis_template` and scores the
# labels as transformers' ZeroShotClassificationPipeline does
# (docs/design/classify.md, "The nli format").
#
# Produce the artifacts with tools/convert_nli.py:
#   python tools/convert_nli.py <checkpoint> <models>/nli-minilm2-l6-h768
# [classify.nli]'s indices are the pipeline's own resolution of the
# checkpoint's label2id; the converter checks them.
#
# `compute_units = "cpu_and_gpu"` keeps it off the ANE. On the ANE it fails
# bucket invariance (Δp 5.9e-3 against its 2.1e-3 fp16 ceiling); on the GPU
# it grades A at 4.0 ms per case (docs/MODELS.md).

id = "nli-minilm2-l6-h768"
task = "zero-shot-classification"
source = { repo = "cross-encoder/nli-MiniLM2-L6-H768", revision = "b95119ce93d3e065de6214e38cd4a97b0f2f2c6d" }
artifact = "model_{seq}.mlmodelc"
tokenizer = "tokenizer.json"
buckets = [128, 256, 512]
max_seq_len = 512
max_batch = 8
problem_type = "single_label"
compute_units = "cpu_and_gpu"

[classify]
format = "nli"
max_labels = 16

[classify.nli]
entailment = 1
contradiction = 0
n_classes = 3
hypothesis_template = "This example is {}."

[classify.io]
input_ids = "input_ids"
attention_mask = "attention_mask"
output = "logits"
