# Qwen/Qwen3-Embedding-0.6B: a Qwen3 causal decoder (28 layers, QK-norm,
# 0.6B parameters, Apache-2.0) with LAST-TOKEN pooling. The server
# L2-normalizes in f32.
#
# Produce the artifacts with tools/convert_qwen3_embedding.py, the same
# recipe as F2LLM-v2-160M. `--format onnx` exports one fp32 model.onnx for
# ONNX Runtime's CPU backend, from which the installed ONNX manifest is
# derived (docs/DECISIONS.md D40). As Core ML artifacts the fp16 weights are
# about 1.2 GB per bucket, past the ANE's 1 GiB per-program limit (D32,
# measured on an M1 Max), so the converter splits each bucket into two
# chunks of about 0.57 GB (`--chunks auto`, D37): the embedding and layers
# 0-8, then layers 9-27, the final norm and the pooling. The installed
# manifest gains the `{chunk}` placeholder and the [chunking] table. Graded
# on an M1 Max, the chunked build is A on the ANE and the GPU and B on the
# CPU (docs/MODELS.md; D37's amendment).
#
# The converter converts the buckets listed below unless given others.
# max_seq_len 2,048 is the largest Core ML bucket, the target D46 sets for
# this build: it is the ANE's length cap (D48), which the 1,024 and 2,048
# buckets were measured to compile and serve within (D46), and the runtime
# caps the CPU path at 1,024 (D33). Each bucket is a program that maps its
# own copy of the weights when loaded (about 1.1 GiB in fp16; on disk,
# chunk k of every bucket shares one file, D49). A 4,096-token bucket,
# which only the GPU serves well, is left out: on the ANE it compiles for
# about half an hour and fails some predictions (D46). The ONNX build, one
# dynamic-shape graph, has its own limit of 4,096 (onnx.toml beside this
# file). The model itself takes up to 32k tokens.
#
# Matryoshka: the model card documents output dimensions from 32 to 1024.
#
# Prefixes are asymmetric: queries get the instruction prompt from the
# model's config_sentence_transformers.json, documents get nothing.

id = "qwen3-embedding-0.6b"
backend = "coreml"
artifact = "model_{seq}.mlmodelc"
tokenizer = "tokenizer.json"
dims = 1024
matryoshka = [1024, 512, 256, 128]
pooling = "none"          # last-token pooling lives inside the model
buckets = [128, 256, 512, 1024, 2048]
max_seq_len = 2048
source = { repo = "Qwen/Qwen3-Embedding-0.6B", revision = "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3" }

[io]
input_ids = "input_ids"
attention_mask = "attention_mask"
output = "embedding"

[prefixes]
query = "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
document = ""

# Named prompts, which a request chooses by prompt_name (docs/DECISIONS.md
# D45): the checkpoint's config_sentence_transformers.json prompts at the
# revision in source, copied exactly. They are the two above; for another
# task, send input_type "none" with "Instruct: <task>\nQuery:" before the
# text (docs/INTEGRATING.md).
[prompts]
query = "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
document = ""
