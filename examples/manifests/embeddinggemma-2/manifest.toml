# google/embeddinggemma-2: the text tower of a Gemma 4 based embedder (271M
# parameters; Apache-2.0). 24 bidirectional layers at hidden size 512 with
# per-layer inputs (a projection of the token embeddings), local layers at
# head_dim 256 and global ones (5, 11, 17, 23) at 512, and a 512 -> 768
# projection inside the model; sentence-transformers mean-pools its output
# and normalizes.
#
# Produce the artifacts with tools/convert_embeddinggemma2.py: one Core ML
# program per bucket, with the fp16 range rewrite the model needs (its
# docstring); `--format onnx` exports one fp32 model.onnx for ONNX Runtime's
# CPU backend, from which the installed ONNX manifest is derived
# (docs/DECISIONS.md D40).
#
# Sliding layers attend where |q - k| <= 512 (transformers 5.19's
# bidirectional window, unhalved), so inputs up to 513 tokens see full
# attention everywhere. The buckets reach 2,048 so the parity corpus's
# boundary and over-length cases exercise the band; the model itself takes
# 8,192 tokens.
#
# Matryoshka: the model card documents 768, 512, 256 and 128.
#
# Prefixes are the model's own prompts (config_sentence_transformers.json).

id = "embeddinggemma-2"
backend = "coreml"
artifact = "model_{seq}.mlmodelc"
tokenizer = "tokenizer.json"
dims = 768
matryoshka = [768, 512, 256, 128]
pooling = "none"          # mean pooling lives inside the Core ML model
buckets = [128, 256, 512, 1024, 2048]
max_seq_len = 2048
source = { repo = "google/embeddinggemma-2", revision = "914f7f89142e33e77833254d9c9b90c3cef7303b" }

[io]
input_ids = "input_ids"
attention_mask = "attention_mask"
output = "embedding"

[prefixes]
query = "task: search result | query: "
document = "title: none | text: "

# Named prompts, which a request chooses by prompt_name (docs/DECISIONS.md
# D45): the checkpoint's config_sentence_transformers.json prompts at the
# revision in source, copied exactly. "document" and "Document" are two
# names, as in the checkpoint: names match exactly, case included.
[prompts]
BitextMining = "task: search result | query: "
Classification = "task: classification | query: "
Clustering = "task: clustering | query: "
CodeRetrieval = "task: code retrieval | query: "
Document = "title: none | text: "
FactChecking = "task: fact checking | query: "
InstructionRetrieval = "task: code retrieval | query: "
MultilabelClassification = "task: classification | query: "
PairClassification = "task: sentence similarity | query: "
QuestionAnswering = "task: question answering | query: "
Reranking = "task: search result | query: "
Retrieval = "task: search result | query: "
Retrieval-document = "title: none | text: "
Retrieval-query = "task: search result | query: "
STS = "task: sentence similarity | query: "
SearchQuery = "task: search result | query: "
SentenceSimilarity = "task: sentence similarity | query: "
Summarization = "task: sentence similarity | query: "
document = "title: none | text: "
query = "task: search result | query: "
