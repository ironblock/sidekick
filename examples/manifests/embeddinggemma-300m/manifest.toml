# EmbeddingGemma-300m as ANE-resident Core ML artifacts: one static-shape
# model per sequence-length bucket ({seq} resolves against `buckets`), with
# mask-aware mean pooling, the model's two dense projections (768->3072->768),
# and L2 normalization all baked into the graph (output `embeddings`,
# statically (1, 768)).
#
# Produce the artifacts with tools/convert_embeddinggemma.py. See
# docs/DECISIONS.md D15 for why per-bucket static shapes and in-model
# pooling are required — flexible shapes and raw hidden-state outputs
# silently push the encoder off the ANE.
#
# Note the size tradeoff: ~600 MB of fp16 weights (300m params). Since
# docs/DECISIONS.md D49 every bucket shares one weights file on disk, but
# each loaded bucket still maps its own copy.

id = "embeddinggemma-300m"
backend = "coreml"
artifact = "model_{seq}.mlmodelc"
tokenizer = "tokenizer.json"
dims = 768
matryoshka = [768, 512, 256, 128]
pooling = "none"          # mean pooling + dense stack live inside the model
buckets = [128, 256, 512]
max_seq_len = 512

[io]
input_ids = "input_ids"
attention_mask = "attention_mask"
output = "embeddings"

# EmbeddingGemma requires task prefixes; applied server-side per input_type.
[prefixes]
query = "task: search result | query: "
document = "title: none | text: "

# Named prompts, which a request chooses by prompt_name (docs/DECISIONS.md
# D45): the checkpoint's config_sentence_transformers.json prompts at
# revision 57c266a740f537b4dc058e1b0cda161fd15afa75, copied exactly.
[prompts]
query = "task: search result | query: "
document = "title: none | text: "
BitextMining = "task: search result | query: "
Clustering = "task: clustering | query: "
Classification = "task: classification | query: "
InstructionRetrieval = "task: code retrieval | query: "
MultilabelClassification = "task: classification | query: "
PairClassification = "task: sentence similarity | query: "
Reranking = "task: search result | query: "
Retrieval = "task: search result | query: "
Retrieval-query = "task: search result | query: "
Retrieval-document = "title: none | text: "
STS = "task: sentence similarity | query: "
Summarization = "task: summarization | query: "
