[package]
name = "sidekick-coreml"
description = "Minimal safe wrapper over Core ML for sidekick (macOS); targets the Apple Neural Engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sidekick-core = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    # NSHomeDirectory: the home Core ML caches compiled programs under.
    "NSPathUtilities",
    "NSRange",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-core-ml = { version = "0.3", default-features = false, features = [
    "std",
    "MLModel",
    "MLModelConfiguration",
    "MLModelDescription",
    "MLFeatureDescription",
    "MLFeatureValue",
    "MLFeatureProvider",
    "MLDictionaryFeatureProvider",
    "MLMultiArray",
    "MLModel_MLModelCompilation",
    # The stateful decoder: KV caches in Core ML state, output backings.
    "MLState",
    "MLStateConstraint",
    "MLModel_MLState",
    "MLPredictionOptions",
    # Input shape constraints: the flexible-shape guard in CoremlModel::load.
    "MLMultiArrayConstraint",
    "MLMultiArrayShapeConstraint",
    "MLMultiArrayShapeConstraintType",
    # Compute plans: which device each operation is assigned to (ane_check).
    "MLComputePlan",
    "MLComputePlanDeviceUsage",
    "MLComputeDeviceProtocol",
    # Whether this Mac has a Neural Engine at all (an Intel Mac doesn't).
    "MLModel_MLComputeDevice",
    "MLNeuralEngineComputeDevice",
    "MLCPUComputeDevice",
    "MLGPUComputeDevice",
    "MLModelStructure",
    "MLModelStructureProgram",
    "MLModelStructureProgramFunction",
    "MLModelStructureProgramBlock",
    "MLModelStructureProgramOperation",
    "block2",
] }
# MLComputePlan loads through a completion-handler block.
block2 = "0.6"
# The decoder: fp16 inputs, the mapped embedding table, the RoPE tables.
half = { workspace = true }
libc = "0.2"
safetensors = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
