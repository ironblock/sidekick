[package]
name = "sidekick-embed"
description = "Embedding backends for sidekick: Core ML/ANE encoders, ONNX Runtime CPU encoders, and a static CPU floor tier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Core ML encoder backend (only meaningful on macOS; elsewhere it is a stub
# that reports Unavailable).
coreml = ["dep:sidekick-coreml"]
# The ONNX Runtime CPU backend (D40). libonnxruntime isn't linked: it
# loads at run time, and only when an onnx model is installed.
onnx = ["sidekick-onnx/runtime"]

[dependencies]
sidekick-core = { workspace = true }
sidekick-coreml = { workspace = true, optional = true }
# Always present: the pinned version and the thread rule, which the daemon
# reports in every build. ort comes in only with the `onnx` feature.
sidekick-onnx = { workspace = true }
tokenizers = { workspace = true }
regex = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
toml = { workspace = true }

# Which invariances the onnx backend's CPU path has (D40).
[[example]]
name = "onnx_invariance"
required-features = ["onnx"]

# What an onnx model's memory does around a long input, by CPU-arena mode,
# and what each mode costs short inputs (D40).
[[example]]
name = "onnx_memory"
required-features = ["onnx"]

# The parity suite (examples/parity): `cargo test` runs its grading unit
# tests on every platform; the live runner needs macOS and `--features coreml`.
[[example]]
name = "parity"
test = true
