[package]
name = "sidekick-llm"
description = "Open causal language models for sidekick's chat route: the chat template, tokenizer, sampler, request queue and generation loop over a stateful decoder (D53)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The Core ML decoder (`sidekick_coreml::KvDecoder`) behind the `Decoder`
# trait. Meaningful on macOS only; elsewhere, and without it, the crate
# builds and tests against any `Decoder`.
coreml = ["dep:sidekick-coreml"]

[dependencies]
sidekick-core = { workspace = true }
sidekick-coreml = { workspace = true, optional = true }
tokenizers = { workspace = true }
regex = { workspace = true }
# The checkpoint's own chat template, rendered as transformers renders it:
# Jinja with Python's string methods (pycompat).
minijinja = { version = "3", features = ["serde", "json", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
# `seed`: a ChaCha generator, seeded by the request or by the OS.
rand_chacha = "0.9"
rand_core = { version = "0.9", features = ["os_rng"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
# localtime_r, for the templates' `strftime_now` (unix).
libc = "0.2"
async-trait = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
sha2 = { workspace = true }
