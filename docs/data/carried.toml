# Core ML results from grading runs whose parity reports weren't kept,
# carried into docs/data/models.json by tools/models_table.py until the
# reports are regenerated. These rows are now the source: docs/MODELS.md's
# embedder grade table is generated from them, and its classifier and
# reranker tables are checked against them. A field nobody recorded is left
# out, and the generator writes it as null.
#
# `worst` is the worst-case cosine (embedders) or the worst |Δp|
# (classifiers and rerankers, `error = "dp"`). `ratio` is a classifier's p99
# |Δp| over its ideal-fp16 ceiling's p99, and `rank_flips` its graded argmax
# flips. No row stores a letter: the generator computes each from these
# numbers with the scales in fixtures/parity/expectations.toml, as the
# parity suite does. `ms` is the table's median per input from the grading
# run.

[defaults]
chip = "Apple M1 Max"
os = "macOS 27.0"
runtime = "Core ML"
date = "2026-09"
precision = "fp16"
source = "docs/MODELS.md table (M1 Max, Sept 2026)"

# Size on disk of a Core ML install: every bucket's .mlmodelc, shared by the
# three paths, measured on the installed directory (M1 Max, October 2026).
# Models with a benchmark run get theirs from it instead.
[disk]
"lfm2.5-embedding-350m" = 2029
"laya-typed-decisions" = 3233

# Embedders: "Confidence grades" table. Drift (the largest change in any
# pairwise similarity), bias (its mean signed change) and rank flips are
# given for the ANE only; ms is ANE (CPU).

[[row]]
model = "bge-small-en-v1.5"
path = "coreml-ane"
worst = 0.99997
worst_case = "empty input"
drift = 0.002
bias = 0.001
rank_flips = 0
ms = 1.9
[[row]]
model = "bge-small-en-v1.5"
path = "coreml-gpu"
worst = 0.999999
[[row]]
model = "bge-small-en-v1.5"
path = "coreml-cpu"
worst = 0.99993
ms = 7.0

