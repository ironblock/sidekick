# Core ML results that exist only as tables in docs/MODELS.md, carried into
# docs/data/models.json by tools/models_table.py until their parity reports
# are regenerated. Each row copies a published table cell; a field the table
# doesn't give is left out, and the generator writes it as null.
#
# `worst` is the worst-case cosine (embedders) or the worst |Δp|
# (classifiers and rerankers, `error = "dp"`). `ms` is the table's median per
# input from the grading run.

[defaults]
chip = "Apple M1 Max"
os = "macOS 27.0"
runtime = "Core ML"
date = "2026-09"
precision = "fp16"
source = "docs/MODELS.md table (M1 Max, Sept 2026)"

# Embedders: "Confidence grades" table. Drift and rank flips are given for
# the ANE only; ms is ANE (CPU).

