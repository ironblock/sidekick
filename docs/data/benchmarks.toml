# Benchmark scores that don't come from the MTEB results repository: what
# a model's own card (or its authors' documentation) reports, copied by hand
# with the page it came from. tools/models_table.py publishes them beside
# each build's fidelity grade, styled as self-reported, and never averages
# them with each other or with an MTEB score. MTEB scores are collected by
# tools/fetch_benchmarks.py into benchmarks.mteb.json instead.
#
# Every entry records:
# - `model`: the sidekick model id (docs/data/models.toml), or a list of ids
#   that build the same checkpoint;
# - `benchmark` and `version`: the benchmark, and which version, split or
#   task set of it, as the source names them;
# - `category`, `metric` and `value`: the value is a string, written as the
#   source writes it ("0.860", "74.30"), so its precision is kept; `scale`
#   says whether it's a "percent" (0–100) or a "fraction" (0–1);
# - `source_kind`: "self-reported" (the model's authors) or "independent";
# - `source_url`: the page, pinned to a revision or commit (a Hugging Face
#   card at its `/blob/<revision>/`, a GitHub file at its commit);
# - `read_on`: the date the value was read there.
# Optional: `trained_on = true` when the source says the model was trained
# on the benchmark's own training data (in-distribution, not zero-shot), and
# `note`. tools/models_table.py --check refuses an entry missing a required
# field, with a card or dataset URL that isn't pinned, or with a read_on that
# isn't a date or is in the future.

