# What tools/model_card.py needs about publishing beyond the licence audit
# (licences.toml) and the checksum ledger (ledger.json). docs/PUBLISHING.md
# describes the repositories, their layout and the cards.

schema = 1

# The Hugging Face organization sidekick's repositories belong to:
# <owner>/<model id>-coreml and <owner>/<model id>-onnx. fetch doesn't read
# this: it fetches from the repository the ledger's `published` record names.
# tools/model_card.py --check refuses a published record under another owner.
owner = "sidekickd"

# The ONNX builds sidekick publishes are its own exports
# (tools/sidekick_convert/onnx_export.py). Where a model's publisher ships an
# ONNX export of its own that grades A against the checkpoint, the card lists
# it as an alternative, pinned to a revision and a file hash. Graded on an
# Apple M1 Max, macOS 27.0, ONNX Runtime 1.27 (Python), on the parity
# suite's 51-case corpus against sentence-transformers in fp32
# (docs/MODELS.md, "ONNX Runtime on the CPU").
[[alternatives]]
model = "bge-small-en-v1.5"
repo = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
file = "onnx/model.onnx"
sha256 = "828e1496d7fabb79cfa4dcd84fa38625c0d3d21da474a00f08db0f559940cf35"
size = 133093490
grade = "A"
worst = "cosine 1.000000"
note = "Its graph also takes token_type_ids, which the manifest's [io] names."

[[alternatives]]
model = "gte-modernbert-base"
repo = "Alibaba-NLP/gte-modernbert-base"
revision = "e7f32e3c00f91d699e8c43b53106206bcc72bb22"
file = "onnx/model.onnx"
sha256 = "947f31df7effaeec4edb57c50e4ed7e0f2034d9336063f92615b92e3e0d24d78"
size = 596392315
grade = "A"
worst = "cosine 1.000000"
note = "The same repository's fp16 export (0.999994) loads only with ONNX Runtime's graph optimizations off, and its int8 export reaches 0.892; neither is listed."

# The Neural Engine compile cache a chat build's install leaves, which the
# user can't delete (docs/BACKENDS.md, "Open chat models on the Neural
# Engine"), measured by tools/release_gate.py on the build's first load in
# its home: `df -k` free space on the root and Data volumes immediately
# before and after the load, with nothing else heavy running, and the
# unified log showing one ANE compile per chunk during it. Paid once per
# install, and again after a macOS update.
[[ane_cache]]
model = "minicpm5-2b"
build = "minicpm5-2b/coreml/palette8/fffc316c8db0"
bytes = 2294718464
weights_bytes = 2278872576
compiles = 4
chip = "Apple M1 Max"
os = "macOS 27.0"
date = "2026-10-29"
