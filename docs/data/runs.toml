# What a parity report doesn't record about the run that produced it, keyed
# by the report's file name (tools/models_table.py takes the directories
# holding them as arguments). A report carries the chip and its results;
# this adds the runtime, OS, precision, sidekick version, date, and whether
# the machine was otherwise idle, which decides whether its timings are
# shown as provisional, and the inference threads (a model's own thread
# default may raise them: Qwen3-Embedding ran 16 on the Threadripper). A
# field nobody recorded is left out (null).

# Chip names as the reports give them (sysctl / /proc/cpuinfo), and as the
# page shows them: by model, never by machine.
[chips]
"Apple M1 Max" = "Apple M1 Max"
"Apple M4 Max" = "Apple M4 Max"
"Intel(R) Xeon(R) W-3235 CPU @ 3.30GHz" = "Intel Xeon W-3235"
"AMD Ryzen 7 5800X 8-Core Processor" = "AMD Ryzen 7 5800X"
"AMD Ryzen Threadripper 3970X 32-Core Processor" = "AMD Ryzen Threadripper 3970X"

# Whole-machine memory (vm_stat) swings by hundreds of MB between runs on a
# desktop, so it is published only where the change stands clear of that
# noise: Core ML on the Neural Engine, whose memory partly lives in system
# services outside the process (EmbeddingGemma: 1.0-1.3 GB over three runs;
# F2LLM: 1.0 GB). Entries are "<path>:<model id>".
[memory]
machine_wide = ["coreml-ane:embeddinggemma-300m", "coreml-ane:f2llm-v2-160m"]

