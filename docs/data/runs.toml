# A model whose threads differ from its run's, by "<report file>:<model id>":
# Qwen3-Embedding's manifest raises its default to 16, which the
# Threadripper's cores allow.
[threads]
"native-linux-threadripper-3970x.json:qwen3-embedding-0.6b" = 16

# Notes for a row, by "<report file>:<model id>:<path>", added to what the
# report says (its gate failures).
[notes]
"coreml-arm64-embeddinggemma-2.json:embeddinggemma-2:coreml-cpu" = "Fails the bucket-invariance gate only: Core ML's CPU softmax rounds differently past 512 keys, moving an embedding by 1 - cos ~6e-5 between buckets; its accuracy is 0.99993, and its ANE and GPU paths grade A"
"coreml-x86_64-gliner2.5-decide.json:gliner2.5-decide:coreml-gpu" = "Fails the bucket-invariance gate on this Intel Mac's GPU (Core ML logs that MPSGraph doesn't support padded tensors on Intel Macs); it passes on Apple silicon"
"coreml-x86_64-laya-typed-decisions.json:laya-typed-decisions:coreml-gpu" = "Fails the bucket-invariance gate on this Intel Mac's GPU (Core ML logs that MPSGraph doesn't support padded tensors on Intel Macs); it passes on Apple silicon"
"coreml-x86_64-deberta-v3-base-zeroshot-v2.0-c.json:deberta-v3-base-zeroshot-v2.0-c:coreml-gpu" = "Fails the bucket-invariance gate on this Intel Mac's GPU, as other classifiers do there (docs/MODELS.md, Intel Macs); within a bucket its accuracy is B level (p99 1.39x its fp16 ceiling), and MultiNLI predictions match fp32 on every pair"
"coreml-x86_64-nli-deberta-v3-base.json:nli-deberta-v3-base:coreml-gpu" = "Fails the bucket-invariance gate on this Intel Mac's GPU, as other classifiers do there (docs/MODELS.md, Intel Macs); within a bucket its accuracy is A level (p99 1.22x its fp16 ceiling), and MultiNLI predictions match fp32 on every pair"
"coreml-x86_64-modernbert-large-zeroshot-v2.0.json:modernbert-large-zeroshot-v2.0:coreml-gpu" = "Fails the bucket-invariance gate on this Intel Mac's GPU, as other classifiers do there (docs/MODELS.md, Intel Macs); within a bucket its accuracy is B level (p99 1.32x its fp16 ceiling), and MultiNLI predictions match fp32 on every pair"
"coreml-x86_64-roberta-large-mnli.json:roberta-large-mnli:coreml-gpu" = "Fails the bucket-invariance gate on this Intel Mac's GPU by a wide margin: a request's probabilities can move by up to 0.08 between buckets (its fp16 ceiling is 0.012), so its scores depend on input length there. Within a bucket its accuracy is B level (p99 1.28x its ceiling), and MultiNLI predictions match fp32 on every pair; prefer another NLI model on an Intel Mac"
"coreml-x86_64-nli-gpu.json:nli-minilm2-l6-h768:coreml-gpu" = "Fails the bucket-invariance gate on this Intel Mac's GPU, as other classifiers do there (docs/MODELS.md, Intel Macs); its accuracy is at its fp16 ceiling, and MultiNLI predictions match fp32 on every pair"
"coreml-x86_64-nli-gpu.json:nli-deberta-v3-small:coreml-gpu" = "Fails the bucket-invariance gate on this Intel Mac's GPU, as other classifiers do there (docs/MODELS.md, Intel Macs); its accuracy is at its fp16 ceiling, and MultiNLI predictions match fp32 on every pair"
"coreml-x86_64-nli-gpu.json:nli-minilm2-l6-h768-ane:coreml-gpu" = "Fails the bucket-invariance gate on this Intel Mac's GPU, as other classifiers do there (docs/MODELS.md, Intel Macs). This is the ANE build run on the GPU; its p99 is 1.3× its fp16 ceiling (B level)"
"coreml-x86_64-nlptown.json:nlptown-sentiment:coreml-cpu" = "Graded F under the exact CPU bucket gate this run used. The gate on Intel Macs is now Δp 5e-4 (provisional; D38 amendment), which its drift of 1.9e-4 passes, so the same results grade A (worst Δp 7.35e-4)"
