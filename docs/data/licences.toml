# Licence audit of every model in docs/data/models.toml, and the publishing
# tier that follows from it (#137). One table per model id, keyed as in
# models.toml. A model with no entry has no verdict and isn't published.
# tools/licences.py validates this file (CI runs it through
# tools/models_table.py --docs --check), and tools/model_card.py builds each
# published repository's licence notice from it. docs/PUBLISHING.md explains
# how the tiers are used.
#
# Tiers
#   1   Publish. The model's licence, and every dataset of the training
#       stages that produced these weights, are permissive (Apache-2.0, MIT,
#       BSD, CC BY, CC0, ODC-By, public domain), and the data is fully
#       disclosed.
#   2a  Publish, with a notice on the model card. The training data has
#       non-commercial terms (the card states them as prominently as a gate
#       would), or is share-alike (CC BY-SA), undisclosed, without a licence
#       a primary source states, or synthetic from a generator that isn't
#       named.
#   2b  Publish behind explicit consent (a gated repository; see
#       docs/PUBLISHING.md): only for terms that must be passed on to every
#       recipient of the files (the Gemma Terms of Use and Prohibited Use
#       Policy).
#   3   Don't publish. The licence forbids redistribution or commercial use,
#       or makes commercial use depend on the user's circumstances. sidekick
#       still documents converting the model locally, and the checksum
#       ledger still records its builds.
#
# What decides the tier
#   The model's licence, its base model's licence, and the data of the
#   training stages that produced these weights from that base
#   (fine-tuning, contrastive training, distillation), as the card, paper
#   or linked repository declares them. A base model's own pretraining data
#   doesn't count; `base_pretraining` records it for the reader. A dataset
#   re-hosted under a new label keeps its original source's terms. Whether
#   non-commercial or share-alike terms on training data reach the trained
#   weights is legally unsettled: this file records the terms, not a
#   conclusion about them.
#
# Fields
#   source                      checkpoint and revision, as in models.toml
#   licence, licence_sources    the model's licence (SPDX id, or a custom
#                               licence's name), and its card and LICENSE
#                               file at that revision
#   base_model                  "org/name@revision", or a description when
#                               the card names no repository; "" if none
#   base_model_licence(_sources)
#   training_disclosure         full | partial | undisclosed
#   training_data               one entry per declared dataset: its name, its
#                               licence as its original source states it
#                               ("unknown" when no primary source states
#                               one), `terms` (permissive | share-alike |
#                               non-commercial | unknown), a source pinned to
#                               a revision where the host allows it, the
#                               training stage, a note, and `hub`: its Hugging
#                               Face dataset ids where its source isn't a Hub
#                               dataset page (for the card's `datasets`)
#   base_pretraining            what the base model declares for pretraining
#   custom_terms                terms that travel with the weights, and what
#                               they require of a redistributor
#   licence_text                the licence text a published build carries
#                               as LICENSE: a file in docs/data/licence-texts/
#                               (its index.toml records the source, pinned,
#                               and the sha256). Required for an MIT or
#                               Apache-2.0 model that is published
#   notice_text                 the upstream NOTICE file a published build
#                               carries as NOTICE (Apache-2.0 Section 4(d)),
#                               likewise, where the model's repository has one
#   ship_files                  files from the source repository, at the
#                               pinned revision, that a published build
#                               carries, copied at upload
#   notice                      text a published build carries as its own
#                               NOTICE file (one sidekick writes, such as the
#                               Gemma Terms of Use's required notice)
#   ship_copies                 documents a published build carries a copy
#                               of, taken from `url` when it is uploaded
#   concerns                    what the card's notice states:
#                               non-commercial-data, copyleft-data,
#                               unlicensed-data, undisclosed-data,
#                               unnamed-synthetic-generator, custom-terms,
#                               use-policy
#   tier, reason                the verdict, and why
#   unverified                  anything not confirmed from a primary source
#   read                        the date the sources were read
#
# Web pages that can't be pinned to a revision (licence pages, terms of use,
# papers' HTML) are cited by URL and were read on the `read` date.

schema = 2

