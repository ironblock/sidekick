# Publishes the model comparison page (docs/site/) to GitHub Pages, with
# its results file (docs/data/models.json, built by tools/models_table.py)
# copied beside it as data/models.json. Pages must be enabled for the
# repository, with GitHub Actions as its source.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp docs/site/index.html _site/
          cp docs/data/models.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
