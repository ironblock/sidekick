name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  models-md:
    # docs/MODELS.md's data tables are generated from docs/data/models.json
    # by tools/models_table.py, and its classifier and reranker tables are
    # checked against it. Fail if the two have drifted apart.
    name: MODELS.md matches the results file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check docs/MODELS.md against docs/data/models.json
        run: python3 tools/models_table.py --docs --check

  task-corpora:
    # The verification corpus (tools/tasks): its committed recipe, claims,
    # captures and locks; the refusal scan over every committed fixture;
    # the hazard checks and determinism on a synthetic capture set; and a
    # full regeneration of the current review set from the committed
    # captures, checked against its lock. The scoring harness
    # (tools/tasks/scoring_*.py): windowing, dedupe, the verdict rules, the
    # control gate, the bootstrap and MDE, the control set, the committed
    # ceilings against the set's lock, and the judge export's format. No
    # checker runs here. Standard library only: no tools run and nothing is
    # downloaded.
    name: Task corpus tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tools/tasks/tests -t tools -v

  linux:
    # x86-64 and arm64 Linux. The onnx backend (D40) runs against the pinned
    # ONNX Runtime there, and SIDEKICK_REQUIRE_ONNX turns its tests' skip
    # into a failure, so a missing runtime can't pass silently.
    name: Test (Linux ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only the x86-64 leg cross-checks macOS code.
          targets: ${{ matrix.runner == 'ubuntu-24.04' && 'aarch64-apple-darwin' || '' }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
      - name: Test (platform-neutral surface)
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: ONNX Runtime (pinned, sha256-checked)
        run: echo "ORT_DYLIB_PATH=$(tools/fetch_onnxruntime.sh "$RUNNER_TEMP/onnxruntime")" >> "$GITHUB_ENV"
      - name: Test with the onnx backend
        env:
          SIDEKICK_REQUIRE_ONNX: "1"
        run: cargo test --workspace --features sidekick-server/onnx
      - name: Clippy with the onnx backend
        run: cargo clippy --workspace --all-targets --features sidekick-server/onnx -- -D warnings
      - name: The Linux onnx build pulls in no Core ML
        run: |
          if cargo tree -p sidekick-server --features onnx -e normal | grep -E 'sidekick-coreml|objc2'; then
            echo "::error::the Linux onnx build depends on Core ML crates"
            exit 1
          fi
      - name: A build without the onnx feature pulls in no ONNX Runtime
        # ort comes only through sidekick-onnx's runtime feature, which
        # sidekick-embed's onnx feature turns on. libsidekick never has it.
        run: |
          for pkg in sidekick-server sidekick-embed-ffi; do
            if cargo tree -p "$pkg" -e normal | grep -E '(^|[^a-z_-])ort(-sys)? v[0-9]'; then
              echo "::error::$pkg depends on ONNX Runtime without the onnx feature"
              exit 1
            fi
          done
      - name: The parity suite grades onnx-cpu here
        # A build with the onnx feature alone grades onnx models on any OS.
        # tiny-onnx's parity model has a committed reference over the whole
        # corpus, so this needs no downloads; no floors exist for CI chips.
        run: |
          cargo build --release -p sidekick-embed --features onnx --example parity
          ./target/release/examples/parity --models-dir crates/sidekick-embed/tests/fixtures/tiny-onnx
      - name: Cross-check macOS-only code compiles
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo check --workspace --target aarch64-apple-darwin --features sidekick-embed/coreml

  macos-intel:
    # Intel Macs: no Foundation Models (sidekick-fm's build script stubs it on
    # x86_64-apple-darwin) and no ANE, but Core ML still builds. The onnx
    # backend runs on ONNX Runtime 1.23.2 here, the last release Microsoft
    # built for Intel macOS (D40).
    name: Build + test (Intel macOS)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-intel
      - name: ONNX Runtime (pinned 1.23.2, sha256-checked)
        run: echo "ORT_DYLIB_PATH=$(tools/fetch_onnxruntime.sh "$RUNNER_TEMP/onnxruntime" osx-x86_64)" >> "$GITHUB_ENV"
      - name: Test with Core ML and the onnx backend
        env:
          SIDEKICK_REQUIRE_ONNX: "1"
        run: cargo test --workspace --features sidekick-server/coreml,sidekick-server/onnx
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features sidekick-server/coreml,sidekick-server/onnx -- -D warnings
      - name: Chat is the stub, without SIDEKICK_FM_STUB; the pin is 1.23.2
        run: |
          cargo build --release -p sidekick-server --features coreml,onnx --bin sidekickd
          ./target/release/sidekickd --version | grep -q "Foundation Models: stub build"
          ./target/release/sidekickd --version | grep -q "ONNX Runtime 1.23.2 expected"
          ! otool -L target/release/sidekickd | grep -q FoundationModels

  macos:
    # The Foundation Models shim compiles differently per SDK: macOS 27
    # features (token usage, model variant, typed errors) exist only in the
    # 27 SDK and sit behind `#if SK_SDK_27`. Build and test both paths:
    # macos-26 carries Xcode 26.x (SDK 26.x), xcode-27 carries Xcode 27.
    # sidekick-fm's build.rs hard-errors if the shim can't build, so a green
    # build proves it built. Runtime FM calls still can't run in CI (no Apple
    # Intelligence on runner VMs); the hardware gates are `smoke-test` and
    # `ane_check`, run on real Macs. The shim's error-classification
    # self-test needs no model and does run here.
    name: Build + test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
      - name: Toolchain in use
        run: |
          xcodebuild -version
          echo "macOS SDK: $(xcrun --show-sdk-version)"
      - name: ONNX Runtime (pinned, sha256-checked)
        run: echo "ORT_DYLIB_PATH=$(tools/fetch_onnxruntime.sh "$RUNNER_TEMP/onnxruntime")" >> "$GITHUB_ENV"
      - name: Test with all features (Core ML + ONNX + real FM shim + C ABI)
        env:
          SIDEKICK_REQUIRE_ONNX: "1"
        run: cargo test --workspace --all-features
      - name: Clippy (macOS-only code, incl. the FFI)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Prove the real FM shim is linked, not the stub
        run: |
          cargo build --release -p sidekick-server --features coreml
          otool -L target/release/sidekickd | grep -q FoundationModels
          ./target/release/sidekickd --version

  macos27-binary-on-macos26:
    # A daemon built with the 27 SDK must still load on macOS 26: every
    # 27-only symbol has to be weak-linked. Building with a 26.0 deployment
    # target makes dyld bind every import at launch (chained fixups), so a
    # successful launch on a macOS 26 runner proves it. Stripping stays off
    # for this build: with a 26.0 deployment target the default debuginfo
    # strip leaves proc-macro dylibs that macOS 27's dyld refuses to load.
    name: 27-SDK sidekickd loads on macOS 26
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: minos26
      - name: Build sidekickd for a macOS 26.0 floor
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          cargo build --release -p sidekick-server --features coreml --bin sidekickd
          vtool -show-build target/release/sidekickd | grep -E 'minos 26\.0'
          otool -l target/release/sidekickd | grep -q LC_DYLD_CHAINED_FIXUPS
          ./target/release/sidekickd --version
          # Tar to keep the executable bit through the artifact round-trip.
          tar -C target/release -czf sidekickd.tar.gz sidekickd
      - uses: actions/upload-artifact@v4
        with:
          name: sidekickd-sdk27-minos26
          path: sidekickd.tar.gz

  launch-on-macos26:
    name: Launch 27-SDK sidekickd on macOS 26
    needs: macos27-binary-on-macos26
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidekickd-sdk27-minos26
      - name: Launch (dyld binds every import here)
        run: |
          tar -xzf sidekickd.tar.gz
          sw_vers
          ./sidekickd --version
