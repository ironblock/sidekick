# Tag-triggered release: check the release notes, build sidekickd +
# libsidekick.dylib with Xcode 27 (real Foundation Models shim — build.rs
# hard-errors on the stub — compiled against the macOS 27 SDK so the macOS 27
# features are in the binary), prove the daemon still loads on macOS 26,
# build sidekickd for x86-64 and arm64 Linux, then publish a GitHub release
# whose body is the release notes, with every tarball and checksum attached.
#
# Every archive ships the pinned ONNX Runtime (D40) beside sidekickd, as
# libonnxruntime.dylib or .so, with its license, and each is smoke-launched:
# the daemon must start and report that runtime in /health.
#
# Release notes are written before tagging, in docs/releases/vX.Y.Z.md, in
# the same change that bumps [workspace.package] version (AGENTS.md):
#
#   git tag -a v0.2.0 -m "sidekick v0.2.0" && git push origin v0.2.0
#
# The tag must match the workspace version and the notes file must exist, or
# the release stops before building.
#
# workflow_dispatch runs the same checks and build as a dry run, for the
# workspace version: artifacts are uploaded to the run for inspection, but no
# release is created.
#
# The xcode-27 runner image is a GitHub public preview (no SLA; jobs may
# queue). Xcode is pinned to a release build because the image also carries
# betas.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  notes:
    name: Check release notes and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version; notes exist
        id: check
        run: |
          WORKSPACE="v$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
            if [ "${VERSION}" != "${WORKSPACE}" ]; then
              echo "::error::tag ${VERSION} doesn't match [workspace.package] version ${WORKSPACE} in Cargo.toml"
              exit 1
            fi
          else
            VERSION="${WORKSPACE}"
          fi
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -s "${NOTES}" ]; then
            echo "::error::no release notes at ${NOTES}; write them before tagging (AGENTS.md)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build release artifacts (aarch64-apple-darwin)
    needs: notes
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    outputs:
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Require the macOS 27 SDK
        run: |
          xcodebuild -version
          SDK="$(xcrun --show-sdk-version)"
          echo "macOS SDK: ${SDK}"
          [ "${SDK%%.*}" -ge 27 ] || { echo "release builds need the macOS 27 SDK, got ${SDK}"; exit 1; }

      - name: Build
        run: |
          # The daemon's honest floor is macOS 26.0 (it hard-links
          # FoundationModels); building for it makes dyld bind every import
          # at launch, which the macOS 26 launch check below relies on.
          # Stripping stays off for this invocation: with a 26.0 deployment
          # target the default debuginfo strip leaves proc-macro dylibs that
          # macOS 27's dyld refuses to load.
          MACOSX_DEPLOYMENT_TARGET=26.0 CARGO_PROFILE_RELEASE_STRIP=none \
            cargo build --release -p sidekick-server --features coreml,onnx --bin sidekickd
          # The C ABI dylib doesn't link FoundationModels; default floor.
          cargo build --release -p sidekick-embed-ffi

      - name: Verify artifacts are the real thing
        run: |
          # Chat: the FM shim must be linked, not the stub, built with SDK 27.
          otool -L target/release/sidekickd | grep -q FoundationModels
          ./target/release/sidekickd --version | grep -q 'macOS SDK 27'
          vtool -show-build target/release/sidekickd | grep -E 'minos 26\.0'
          otool -l target/release/sidekickd | grep -q LC_DYLD_CHAINED_FIXUPS
          # C ABI: the exported surface must be present.
          for sym in _sk_abi_version _sk_pool_open _sk_embed _sk_model_info; do
            nm -gU target/release/libsidekick.dylib | grep -q " $sym\$"
          done

      - name: ONNX Runtime (pinned, sha256-checked)
        run: echo "ORT_LIB=$(tools/fetch_onnxruntime.sh "$RUNNER_TEMP/onnxruntime" osx-arm64)" >> "$GITHUB_ENV"

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="dry-run-$(git rev-parse --short HEAD)"
          fi
          NAME="sidekick-${VERSION}-aarch64-apple-darwin"
          mkdir -p "dist/${NAME}"
          cp target/release/sidekickd "dist/${NAME}/"
          cp "${ORT_LIB}" "dist/${NAME}/libonnxruntime.dylib"
          cp "$(dirname "${ORT_LIB}")/../LICENSE" "dist/${NAME}/ONNXRUNTIME_LICENSE"
          cp "$(dirname "${ORT_LIB}")/../ThirdPartyNotices.txt" "dist/${NAME}/ONNXRUNTIME_THIRD_PARTY_NOTICES.txt"
          cp target/release/libsidekick.dylib "dist/${NAME}/"
          cp crates/sidekick-embed-ffi/include/sidekick.h "dist/${NAME}/"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md docs/INTEGRATING.md "dist/${NAME}/"
          cp "docs/releases/${{ needs.notes.outputs.version }}.md" "dist/${NAME}/RELEASE_NOTES.md"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to the run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  verify-macos26:
    # A 27-SDK daemon must still load on macOS 26 (27-only symbols weak).
    name: Launch the release daemon on macOS 26
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
      - name: Launch (dyld binds every import here) and load ONNX Runtime
        run: |
          tar -xzf "${{ needs.build.outputs.name }}.tar.gz"
          sw_vers
          "./${{ needs.build.outputs.name }}/sidekickd" --version
          tools/smoke_launch.sh "./${{ needs.build.outputs.name }}/sidekickd"

  build-linux:
    # x86-64 and arm64 Linux: sidekickd with the onnx backend (D40), no Core
    # ML, and chat reporting Unavailable (no Foundation Models). Built on
    # Ubuntu 22.04, so the binary needs glibc 2.35 or later.
    name: Build release artifacts (${{ matrix.target }})
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            ort: linux-x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            ort: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release -p sidekick-server --features onnx --bin sidekickd
      - name: ONNX Runtime (pinned, sha256-checked)
        run: echo "ORT_LIB=$(tools/fetch_onnxruntime.sh "$RUNNER_TEMP/onnxruntime" ${{ matrix.ort }})" >> "$GITHUB_ENV"
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="dry-run-$(git rev-parse --short HEAD)"
          fi
          NAME="sidekick-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp target/release/sidekickd "dist/${NAME}/"
          cp "${ORT_LIB}" "dist/${NAME}/libonnxruntime.so"
          cp "$(dirname "${ORT_LIB}")/../LICENSE" "dist/${NAME}/ONNXRUNTIME_LICENSE"
          cp "$(dirname "${ORT_LIB}")/../ThirdPartyNotices.txt" "dist/${NAME}/ONNXRUNTIME_THIRD_PARTY_NOTICES.txt"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md docs/INTEGRATING.md "dist/${NAME}/"
          cp "docs/releases/${{ needs.notes.outputs.version }}.md" "dist/${NAME}/RELEASE_NOTES.md"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "NAME=${NAME}" >> "$GITHUB_ENV"
      - name: Smoke-launch from the archive
        run: |
          mkdir smoke && tar -C smoke -xzf "dist/${NAME}.tar.gz"
          "smoke/${NAME}/sidekickd" --version
          tools/smoke_launch.sh "smoke/${NAME}/sidekickd"
      - name: Upload artifacts to the run
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: [notes, build, verify-macos26, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-linux-gnu
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The hand-written notes come first; --generate-notes appends
          # GitHub's changelog link.
          gh release create "${GITHUB_REF_NAME}" \
            --title "sidekick ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${{ needs.notes.outputs.version }}.md" \
            --generate-notes \
            --verify-tag \
            dist/*.tar.gz dist/*.tar.gz.sha256
