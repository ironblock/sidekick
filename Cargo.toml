[workspace]
resolver = "2"
members = [
    "crates/sidekick-core",
    "crates/sidekick-coreml",
    "crates/sidekick-fm",
    "crates/sidekick-embed",
    "crates/sidekick-embed-ffi",
    "crates/sidekick-onnx",
    "crates/sidekick-server",
]

[workspace.package]
version = "0.12.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/ironblock/sidekick"

[workspace.dependencies]
sidekick-core = { path = "crates/sidekick-core" }
sidekick-coreml = { path = "crates/sidekick-coreml" }
sidekick-fm = { path = "crates/sidekick-fm" }
sidekick-embed = { path = "crates/sidekick-embed" }
sidekick-onnx = { path = "crates/sidekick-onnx" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pure-Rust regex backend: keeps the build free of C/C++ cross-compilation.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
safetensors = "0.5"
regex = "1"
half = "2"
sha2 = "0.10"
# ONNX Runtime, loaded at startup rather than linked (D40). api-23 makes
# 1.23 the oldest runtime it accepts: 1.23.2 is the last Microsoft built for
# Intel macOS, which sidekick pins there; 1.28.3 everywhere else.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-23"] }
libloading = "0.9"
base64 = "0.22"
axum = "0.8"
tower = "0.5"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
